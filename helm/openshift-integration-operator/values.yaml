operator:
  image:
    repository: quay.io/maximilianopizarro/openshift-integration-operator
    tag: v0.4.1
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  serviceAccount:
    create: true
    name: integration-operator-sa
  proxyPort: 8443
  watchedNamespaces: []   # empty = cluster-wide watch

workers:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilization: 70
  targetMemoryUtilization: 80
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

telemetry:
  otelCollectorEndpoint: http://integration-otel-collector:4317
  enabled: true

git:
  provider: auto          # auto | gitea | github | gitlab
  url: ""                 # base API URL (empty = auto-detect from gitRepository in CR)
  username: ""
  password: ""
  org: ""

# Backward compat — if set, these override git.* equivalents
gitea:
  url: https://gitea-gitea.apps.cluster-xtvzv.dynamic.redhatworkshops.io
  username: user1
  password: ""   # set via --set or External Secrets; never commit real passwords
  org: user1

scaffolds:
  source: embedded   # embedded | git | oci | configmap
  gitRepo: ""
  gitBranch: main
  ociImage: ""
  configMapPrefix: "scaffold-"
  templates:
    camelRoute: true
    camelKamelet: true
    camelPipe: true
    camelTest: true
    sonataflow: true

secrets:
  provider: values   # values | external-secrets | sealed-secrets
  externalSecrets:
    enabled: false
    secretStoreRef: cluster-secret-store
    refreshInterval: 1h
    gitCredentialsSecretName: integration-git-credentials

github:
  url: https://api.github.com
  token: ""

gitlab:
  url: https://gitlab.com
  token: ""

argocd:
  enabled: true
  namespace: openshift-gitops

kaoto:
  enabled: true
  instanceUrl: ""
  routeHost: ""
  image:
    repository: quay.io/kaotoio/kaoto-app
    tag: main
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

consolePlugin:
  enabled: true
  image:
    repository: quay.io/maximilianopizarro/integration-console-plugin
    tag: v0.4.1
  replicas: 1

sonataflow:
  enabled: true
  namespace: kogito-bpm
  crNamePrefix: iflow-
  apiVersion: sonataflow.org/v1alpha08
  consoleUrl: ""
  consoleRouteHost: sonataflow-management-console-kogito-bpm

mcp:
  allowedServerUrls: []

ephemeral:
  enabled: true
  defaultTtlSeconds: 3600
  maxTtlSeconds: 86400
  preferFullWorker: false
  camelWorkerImage: quay.io/maximilianopizarro/camel-worker-core:v0.4.1
  camelWorkerMessagingImage: quay.io/maximilianopizarro/camel-worker-messaging:v0.4.1
  camelWorkerHttpImage: quay.io/maximilianopizarro/camel-worker-http:v0.4.1
  camelWorkerDataImage: quay.io/maximilianopizarro/camel-worker-data:v0.4.1
  camelWorkerCloudImage: quay.io/maximilianopizarro/camel-worker-cloud:v0.4.1
  camelWorkerAiImage: quay.io/maximilianopizarro/camel-worker-ai:v0.4.1
  camelWorkerFullImage: quay.io/maximilianopizarro/camel-worker-full:v0.4.1
  camelTestImage: quay.io/maximilianopizarro/camel-test-runner:v0.4.1
  camelK:
    detect: true

tekton:
  approvalEnabled: true
  approver: "system:admin"

namespace: openshift-integration
