operator:
  image:
    repository: quay.io/maximilianopizarro/openshift-integration-operator
    tag: v0.8.2
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  serviceAccount:
    create: true
    name: integration-operator-sa
  proxyPort: 8443
  watchedNamespaces: []   # empty = cluster-wide watch

rbac:
  selfService:
    # When true (default), any authenticated user can manage IntegrationFlows in their active project.
    # Set false and bind Role/ClusterRole explicitly to tighten access post-install.
    enabled: true

workers:
  # Default thresholds for per-flow HPAs (one HPA per IntegrationFlow worker Deployment)
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilization: 70
  targetMemoryUtilization: 80
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

telemetry:
  otelCollectorEndpoint: http://integration-otel-collector:4317
  enabled: true

git:
  provider: auto          # auto | gitea | github | gitlab
  url: ""                 # base API URL (empty = auto-detect from gitRepository in CR)
  username: ""
  password: ""
  org: ""

# Backward compat — if set, these override git.* equivalents
gitea:
  url: https://gitea-gitea.apps.cluster-xtvzv.dynamic.redhatworkshops.io
  username: user1
  password: ""   # set via --set or External Secrets; never commit real passwords
  org: user1

scaffolds:
  source: embedded   # embedded | git | oci | configmap
  gitRepo: ""
  gitBranch: main
  ociImage: ""
  configMapPrefix: "scaffold-"
  templates:
    camelRoute: true
    camelKamelet: true
    camelPipe: true
    camelTest: true
    sonataflow: true

flowCatalog:
  source: remote          # remote | configmap
  configMapName: flow-catalog
  configMapKey: flow-catalog.json
  embedOnInstall: true    # when source=configmap, create ConfigMap from bundled JSON

secrets:
  # Credential delivery mechanism for Git push (operator) and Tekton git-clone (builds):
  #   values           — inline Helm values → Deployment env + integration-git-basic-auth Secret (dev only)
  #   external-secrets — External Secrets Operator syncs Vault/AWS/Azure into integration-git-basic-auth
  #   sealed-secrets   — no chart templates; apply SealedSecret manually (see docs/operations.html)
  provider: values
  externalSecrets:
    enabled: false
    secretStoreRef: cluster-secret-store
    refreshInterval: 1h
    gitCredentialsSecretName: integration-git-basic-auth

github:
  url: https://api.github.com
  token: ""

gitlab:
  url: https://gitlab.com
  token: ""

argocd:
  enabled: true
  namespace: openshift-gitops

kaoto:
  enabled: true
  instanceUrl: ""
  routeHost: ""
  image:
    repository: quay.io/kaotoio/kaoto-app
    tag: main
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

consolePlugin:
  enabled: true
  image:
    repository: quay.io/maximilianopizarro/integration-console-plugin
    tag: v0.8.2
  replicas: 1

sonataflow:
  enabled: true
  namespace: kogito-bpm
  crNamePrefix: iflow-
  apiVersion: sonataflow.org/v1alpha08
  consoleUrl: ""
  consoleRouteHost: sonataflow-management-console-kogito-bpm

mcp:
  allowedServerUrls: []

ephemeral:
  enabled: true
  defaultTtlSeconds: 3600
  maxTtlSeconds: 86400
  preferFullWorker: false
  camelWorkerImage: quay.io/maximilianopizarro/camel-worker-core:v0.8.2
  camelWorkerMessagingImage: quay.io/maximilianopizarro/camel-worker-messaging:v0.8.2
  camelWorkerHttpImage: quay.io/maximilianopizarro/camel-worker-http:v0.8.2
  camelWorkerDataImage: quay.io/maximilianopizarro/camel-worker-data:v0.8.2
  camelWorkerCloudImage: quay.io/maximilianopizarro/camel-worker-cloud:v0.8.2
  camelWorkerAiImage: quay.io/maximilianopizarro/camel-worker-ai:v0.8.2
  camelWorkerFullImage: quay.io/maximilianopizarro/camel-worker-full:v0.8.2
  camelTestImage: quay.io/maximilianopizarro/camel-test-runner:v0.8.2
  camelK:
    detect: true

tekton:
  approvalEnabled: true
  approver: "system:admin"

namespace: openshift-integration
