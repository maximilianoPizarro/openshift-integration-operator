{{- if .Values.kaoto.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaoto
  namespace: {{ .Values.namespace }}
  labels:
    app: kaoto
    app.kubernetes.io/part-of: integration-platform
    app.openshift.io/runtime: camel
    {{- include "operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.kaoto.replicas | default 1 }}
  selector:
    matchLabels:
      app: kaoto
  template:
    metadata:
      labels:
        app: kaoto
    spec:
      containers:
        - name: kaoto
          image: "{{ .Values.kaoto.image.repository }}:{{ .Values.kaoto.image.tag }}"
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.kaoto.resources.requests.cpu | default "100m" }}
              memory: {{ .Values.kaoto.resources.requests.memory | default "256Mi" }}
            limits:
              cpu: {{ .Values.kaoto.resources.limits.cpu | default "500m" }}
              memory: {{ .Values.kaoto.resources.limits.memory | default "512Mi" }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kaoto
  namespace: {{ .Values.namespace }}
  labels:
    app: kaoto
    {{- include "operator.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: kaoto
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kaoto
  namespace: {{ .Values.namespace }}
  labels:
    app: kaoto
    {{- include "operator.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: kaoto
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
