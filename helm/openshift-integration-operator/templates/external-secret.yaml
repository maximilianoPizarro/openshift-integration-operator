{{- if or (eq .Values.secrets.provider "external-secrets") .Values.secrets.externalSecrets.enabled }}
{{- $gitBaseUrl := .Values.git.url | default .Values.gitea.url | default "" }}
{{- $gitHost := regexReplaceAll "^https?://" $gitBaseUrl "" | trimSuffix "/" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: integration-git-basic-auth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.externalSecrets.gitCredentialsSecretName | default "integration-git-basic-auth" }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ "{{" }} .username {{ "}}" }}"
        password: "{{ "{{" }} .password {{ "}}" }}"
        GIT_PASSWORD: "{{ "{{" }} .password {{ "}}" }}"
        GITEA_PASSWORD: "{{ "{{" }} .password {{ "}}" }}"
        GITHUB_TOKEN: "{{ "{{" }} .github_token {{ "}}" }}"
        GITLAB_TOKEN: "{{ "{{" }} .gitlab_token {{ "}}" }}"
        .git-credentials: "https://{{ "{{" }} .username {{ "}}" }}:{{ "{{" }} .password {{ "}}" }}@{{ $gitHost }}"
        .gitconfig: |
          [safe]
            directory = *
          [credential]
            helper = store
  data:
    - secretKey: username
      remoteRef:
        key: integration-platform/git
        property: username
    - secretKey: password
      remoteRef:
        key: integration-platform/git
        property: password
    - secretKey: github_token
      remoteRef:
        key: integration-platform/github
        property: token
    - secretKey: gitlab_token
      remoteRef:
        key: integration-platform/gitlab
        property: token
{{- end }}
