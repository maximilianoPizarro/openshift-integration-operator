apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "operator.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    app.openshift.io/runtime: quarkus
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"integration-console-plugin"}]'
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.operator.serviceAccount.name }}
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: {{ .Values.operator.proxyPort | default 8443 }}
              protocol: TCP
          env:
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otelCollectorEndpoint }}
            - name: QUARKUS_OTEL_SERVICE_NAME
              value: openshift-integration-operator
            - name: GIT_PROVIDER
              value: {{ .Values.git.provider | default "auto" }}
            - name: GIT_URL
              value: {{ .Values.git.url | default .Values.gitea.url | default "" }}
            - name: GIT_USERNAME
              value: {{ .Values.git.username | default .Values.gitea.username | default "" }}
            - name: GIT_PASSWORD
              value: {{ .Values.git.password | default .Values.gitea.password | default "" }}
            - name: GIT_ORG
              value: {{ .Values.git.org | default .Values.gitea.org | default "" }}
            - name: GITEA_URL
              value: {{ .Values.gitea.url | default .Values.git.url | default "" }}
            - name: GITEA_USERNAME
              value: {{ .Values.gitea.username | default .Values.git.username | default "" }}
            - name: GITEA_PASSWORD
              value: {{ .Values.gitea.password | default .Values.git.password | default "" }}
            - name: GITEA_ORG
              value: {{ .Values.gitea.org | default .Values.git.org | default "" }}
            - name: GITHUB_URL
              value: {{ .Values.github.url | default "https://api.github.com" }}
            - name: GITHUB_TOKEN
              value: {{ .Values.github.token | default "" | quote }}
            - name: GITLAB_URL
              value: {{ .Values.gitlab.url | default "https://gitlab.com" }}
            - name: GITLAB_TOKEN
              value: {{ .Values.gitlab.token | default "" | quote }}
            - name: EPHEMERAL_ENABLED
              value: {{ .Values.ephemeral.enabled | quote }}
            - name: EPHEMERAL_DEFAULT_TTL_SECONDS
              value: {{ .Values.ephemeral.defaultTtlSeconds | quote }}
            - name: EPHEMERAL_MAX_TTL_SECONDS
              value: {{ .Values.ephemeral.maxTtlSeconds | quote }}
            - name: SCAFFOLDS_SOURCE
              value: {{ .Values.scaffolds.source | default "embedded" | quote }}
            - name: EPHEMERAL_CAMEL_WORKER_IMAGE
              value: {{ .Values.ephemeral.camelWorkerImage | quote }}
            - name: EPHEMERAL_CAMEL_WORKER_MESSAGING_IMAGE
              value: {{ .Values.ephemeral.camelWorkerMessagingImage | quote }}
            - name: EPHEMERAL_CAMEL_WORKER_HTTP_IMAGE
              value: {{ .Values.ephemeral.camelWorkerHttpImage | quote }}
            - name: EPHEMERAL_CAMEL_WORKER_DATA_IMAGE
              value: {{ .Values.ephemeral.camelWorkerDataImage | quote }}
            - name: EPHEMERAL_CAMEL_WORKER_CLOUD_IMAGE
              value: {{ .Values.ephemeral.camelWorkerCloudImage | quote }}
            - name: EPHEMERAL_CAMEL_WORKER_AI_IMAGE
              value: {{ .Values.ephemeral.camelWorkerAiImage | quote }}
            - name: EPHEMERAL_CAMEL_WORKER_FULL_IMAGE
              value: {{ .Values.ephemeral.camelWorkerFullImage | quote }}
            - name: EPHEMERAL_CAMEL_TEST_IMAGE
              value: {{ .Values.ephemeral.camelTestImage | quote }}
            - name: PLATFORM_NAMESPACE
              value: {{ .Values.namespace | quote }}
            - name: SONATAFLOW_ENABLED
              value: {{ .Values.sonataflow.enabled | quote }}
            - name: SONATAFLOW_NAMESPACE
              value: {{ .Values.sonataflow.namespace | quote }}
            - name: SONATAFLOW_CR_NAME_PREFIX
              value: {{ .Values.sonataflow.crNamePrefix | quote }}
            - name: SONATAFLOW_API_VERSION
              value: {{ .Values.sonataflow.apiVersion | quote }}
            - name: SONATAFLOW_CONSOLE_URL
              value: {{ .Values.sonataflow.consoleUrl | quote }}
            - name: SONATAFLOW_CONSOLE_ROUTE_HOST
              value: {{ .Values.sonataflow.consoleRouteHost | quote }}
            - name: KAOTO_INSTANCE_URL
              value: {{ .Values.kaoto.instanceUrl | quote }}
            - name: KAOTO_ROUTE_HOST
              value: {{ .Values.kaoto.routeHost | quote }}
            - name: ARGOCD_NAMESPACE
              value: {{ .Values.argocd.namespace | quote }}
            - name: QUARKUS_HTTP_SSL_PORT
              value: {{ .Values.operator.proxyPort | default 8443 | quote }}
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_FILES
              value: /etc/serving-cert/tls.crt
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES
              value: /etc/serving-cert/tls.key
            - name: QUARKUS_HTTP_INSECURE_REQUESTS
              value: enabled
          volumeMounts:
            - name: serving-cert
              readOnly: true
              mountPath: /etc/serving-cert
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      volumes:
        - name: serving-cert
          secret:
            secretName: {{ include "operator.fullname" . }}-serving-cert
            defaultMode: 420
