apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: ephemeral-bitcoin-price
  namespace: openshift-integration
spec:
  deploymentMode: EPHEMERAL
  integrationType: CAMEL_ROUTE
  engine: CAMEL
  ephemeral:
    ttlSeconds: 3600
  kaotoDesign: |
    - route:
        id: bitcoin-price-monitor
        from:
          uri: "timer:btcPoll"
          parameters:
            period: "60000"
          steps:
            - setHeader:
                name: CamelHttpMethod
                constant: GET
            - to:
                uri: "https://api.coindesk.com/v1/bpi/currentprice.json"
            - unmarshal:
                json: {}
            - setProperty:
                name: btcUsd
                jsonpath: "$.bpi.USD.rate"
            - setProperty:
                name: btcEur
                jsonpath: "$.bpi.EUR.rate"
            - log:
                message: "Bitcoin price — USD: ${exchangeProperty.btcUsd} | EUR: ${exchangeProperty.btcEur}"
