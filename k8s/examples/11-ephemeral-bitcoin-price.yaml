apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: ephemeral-exchange-rate
  namespace: openshift-integration
spec:
  deploymentMode: EPHEMERAL
  integrationType: CAMEL_ROUTE
  engine: CAMEL
  ephemeral:
    ttlSeconds: 3600
  kaotoDesign: |
    - route:
        id: exchange-rate-poll
        from:
          uri: "timer:fxPoll"
          parameters:
            period: "60000"
          steps:
            - setHeader:
                name: CamelHttpMethod
                constant: GET
            - to:
                uri: "https://open.er-api.com/v6/latest/USD"
            - unmarshal:
                json: {}
            - setProperty:
                name: eurRate
                jsonpath: "$.rates.EUR"
            - setProperty:
                name: gbpRate
                jsonpath: "$.rates.GBP"
            - setProperty:
                name: arsRate
                jsonpath: "$.rates.ARS"
            - log:
                message: "USD exchange rates — EUR: ${exchangeProperty.eurRate} | GBP: ${exchangeProperty.gbpRate} | ARS: ${exchangeProperty.arsRate}"
