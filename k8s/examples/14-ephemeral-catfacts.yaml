apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: ephemeral-catfacts
  namespace: openshift-integration
spec:
  deploymentMode: EPHEMERAL
  integrationType: CAMEL_ROUTE
  engine: CAMEL
  ephemeral:
    ttlSeconds: 1800
  kaotoDesign: |
    - route:
        id: catfact-poller
        from:
          uri: "timer:catFacts"
          parameters:
            period: "15000"
          steps:
            - setHeader:
                name: CamelHttpMethod
                constant: GET
            - to:
                uri: "https://catfact.ninja/fact"
            - unmarshal:
                json: {}
            - setProperty:
                name: fact
                jsonpath: "$.fact"
            - setProperty:
                name: length
                jsonpath: "$.length"
            - log:
                message: "Cat Fact (${exchangeProperty.length} chars): ${exchangeProperty.fact}"
