# Ephemeral Mercado Pago payment webhook receiver (LatAm)
# oc create secret generic mercadopago-credentials -n openshift-integration \
#   --from-literal=MERCADOPAGO_ACCESS_TOKEN=REPLACE
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: ephemeral-mercadopago-webhook
  namespace: openshift-integration
spec:
  deploymentMode: EPHEMERAL
  integrationType: CAMEL_ROUTE
  engine: CAMEL
  ephemeral:
    ttlSeconds: 3600
    workerImage: quay.io/maximilianopizarro/camel-worker-http:v0.8.0
  secrets:
    - name: mercadopago-credentials
      envFrom: true
  targeting:
    strategy: explicit
    clusters: [local]
  kaotoDesign: |
    - route:
        id: mercadopago-payment-notify
        from:
          uri: "platform-http:/webhook/mercadopago/payments"
          parameters:
            httpMethodRestrict: POST
          steps:
            - log:
                message: "Mercado Pago payment: ${body}"
