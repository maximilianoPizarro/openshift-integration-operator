apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: telegram-bot
  labels:
    platform.io/catalog-category: social-communication
    platform.io/camel-component: telegram
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/telegram-bot
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: telegram-bot
        from:
          uri: "telegram:bots?authorizationToken={{telegram.token}}"
          steps:
            - log:
                message: "Received Telegram message: ${body}"
            - choice:
                when:
                  - simple: "${body} contains '/status'"
                    steps:
                      - setBody:
                          constant: "All systems operational."
                otherwise:
                  steps:
                    - setBody:
                        simple: "Echo: ${body}"
            - to:
                uri: "telegram:bots?authorizationToken={{telegram.token}}&chatId=${header.CamelTelegramChatId}"
