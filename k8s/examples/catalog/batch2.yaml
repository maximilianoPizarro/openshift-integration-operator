        id: dead-letter-channel
        from:
          uri: "kafka:payment-requests?brokers={{kafka.brokers}}&groupId=dlc"
          steps:
            - errorHandler:
                deadLetterChannel:
                  deadLetterUri: "kafka:payment-dlq?brokers={{kafka.brokers}}"
                  redeliveryPolicy:
                    maximumRedeliveries: 3
