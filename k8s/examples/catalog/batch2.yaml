apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: content-based-router
  labels:
    platform.io/catalog-category: eip-patterns
    platform.io/camel-component: direct
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/content-based-router
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: content-based-router
        from:
          uri: "kafka:incoming-orders?brokers={{kafka.brokers}}&groupId=cbr"
          steps:
            - unmarshal:
                json: {}
            - log:
                message: "Routing order type: ${body[orderType]}"
            - choice:
                when:
                  - simple: "${body[orderType]} == 'RETAIL'"
                    steps:
                      - to:
                          uri: "kafka:retail-orders?brokers={{kafka.brokers}}"
                  - simple: "${body[orderType]} == 'WHOLESALE'"
                    steps:
                      - to:
                          uri: "kafka:wholesale-orders?brokers={{kafka.brokers}}"
                  - simple: "${body[orderType]} == 'SUBSCRIPTION'"
                    steps:
                      - to:
                          uri: "kafka:subscription-orders?brokers={{kafka.brokers}}"
                otherwise:
                  steps:
                    - to:
                        uri: "kafka:unknown-orders?brokers={{kafka.brokers}}"
---
