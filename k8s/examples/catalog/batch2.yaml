# DevOps/CI-CD (101-115)
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: github-webhook
  labels:
    platform.io/catalog-category: devops-cicd
    platform.io/camel-component: platform-http
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/github-webhook
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: github-webhook
        from:
          uri: "platform-http:/api/github/webhook?httpMethodRestrict=POST"
          steps:
            - unmarshal:
                json: {}
            - log:
                message: "GitHub event: ${header.X-GitHub-Event} on ${body[repository][full_name]}"
            - choice:
                when:
                  - simple: "${header.X-GitHub-Event} == 'push'"
                    steps:
                      - to:
                          uri: "direct:handle-push"
                  - simple: "${header.X-GitHub-Event} == 'pull_request'"
                    steps:
                      - to:
                          uri: "direct:handle-pr"
            - to:
                uri: "kafka:github-events?brokers={{kafka.brokers}}"
---
