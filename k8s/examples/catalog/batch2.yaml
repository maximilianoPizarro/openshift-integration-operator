  gitRepository: https://gitea.example.com/user1/excel-to-db
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: excel-to-db
        from:
          uri: "file:{{input.dir}}/excel?include=.*\\.xlsx&move=.done"
          steps:
            - log:
                message: "Processing Excel file: ${header.CamelFileName}"
            - to:
                uri: "bean:excelParser?method=parseToRows"
            - split:
                simple: "${body}"
                steps:
                  - log:
                      message: "Inserting row ${header.CamelSplitIndex} into database"
                  - to:
                      uri: "sql:INSERT INTO imported_data (col_a, col_b, col_c, imported_at) VALUES (:#colA, :#colB, :#colC, CURRENT_TIMESTAMP)?dataSource=#dataSource"
---
