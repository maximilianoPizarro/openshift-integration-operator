apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: retry-redelivery
  labels:
    platform.io/catalog-category: eip-patterns
    platform.io/camel-component: direct
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/retry-redelivery
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: retry-redelivery
        from:
          uri: "kafka:api-calls?brokers={{kafka.brokers}}&groupId=retry"
          steps:
            - onException:
                handled:
                  constant: "true"
                exception:
                  - java.net.ConnectException
                redeliveryPolicy:
                  maximumRedeliveries: 5
                  redeliveryDelay: 2000
                  backOffMultiplier: 2.0
                  useExponentialBackOff: true
                steps:
                  - log:
                      message: "Request failed after retries, sending to DLQ"
                  - to:
                      uri: "kafka:api-calls-dlq?brokers={{kafka.brokers}}"
            - log:
                message: "Calling external API with retry policy"
            - to:
                uri: "http://external-api:8080/api/resource?httpMethod=POST"
---
