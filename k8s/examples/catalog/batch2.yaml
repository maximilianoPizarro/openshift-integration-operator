    clusters:
      - local
  kaotoDesign: |
    - route:
        id: circuit-breaker
        from:
          uri: "platform-http:/api/inventory?httpMethodRestrict=GET"
          steps:
            - circuitBreaker:
                resilience4jConfiguration:
                  failureRateThreshold: 50
                  waitDurationInOpenState: 30000
                  slidingWindowSize: 10
                steps:
                  - to:
                      uri: "http://inventory-service:8080/api/stock?httpMethod=GET"
                onFallback:
                  steps:
                    - setBody:
                        constant: "{\"status\":\"degraded\",\"message\":\"Inventory service unavailable, showing cached data\"}"
            - log:
                message: "Inventory response: ${body}"
