apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: slack-notify
  labels:
    platform.io/catalog-category: social-communication
    platform.io/camel-component: slack
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/slack-notify
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: slack-notify
        from:
          uri: "timer:slack-trigger?period=60000"
          steps:
            - setBody:
                simple: "System health check passed at ${date:now:yyyy-MM-dd HH:mm:ss}"
            - log:
                message: "Sending Slack notification: ${body}"
            - to:
                uri: "slack:#general?webhookUrl={{slack.webhook.url}}"
