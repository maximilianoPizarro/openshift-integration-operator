metadata:
  name: consul-kv-sync
  labels:
    platform.io/catalog-category: devops-cicd
    platform.io/camel-component: consul
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/consul-kv-sync
  branch: main
  targeting:
    strategy: explicit
