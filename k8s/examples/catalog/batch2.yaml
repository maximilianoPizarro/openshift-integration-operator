apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: schematron-validate
  labels:
    platform.io/catalog-category: file-document
    platform.io/camel-component: schematron
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/schematron-validate
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: schematron-validate
        from:
          uri: "file:{{input.dir}}/validate-schematron?include=.*\\.xml&move=.validated"
          steps:
            - log:
                message: "Validating XML with Schematron rules: ${header.CamelFileName}"
            - to:
                uri: "schematron:rules/business-rules.sch"
            - choice:
                when:
                  - simple: "${header.CamelSchematronValidationStatus} == 'SUCCESS'"
                    steps:
                      - log:
                          message: "Schematron validation passed for ${header.CamelFileName}"
                      - to:
                          uri: "file:{{output.dir}}/valid"
                otherwise:
                  steps:
                    - log:
                        message: "Schematron validation FAILED for ${header.CamelFileName}: ${header.CamelSchematronValidationReport}"
                    - to:
                        uri: "file:{{output.dir}}/invalid"
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: json-schema-validate
  labels:
    platform.io/catalog-category: file-document
    platform.io/camel-component: json-validator
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/json-schema-validate
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: json-schema-validate
        from:
          uri: "platform-http:/api/validate/json?httpMethodRestrict=POST"
          steps:
            - log:
                message: "Validating JSON payload against schema"
            - doTry:
                steps:
                  - to:
                      uri: "json-validator:schemas/order-schema.json"
                  - setBody:
                      constant: "{\"valid\":true,\"message\":\"JSON schema validation passed\"}"
                doCatch:
                  - exception:
                      - org.apache.camel.component.jsonvalidator.JsonValidationException
                    steps:
                      - setBody:
                          simple: "{\"valid\":false,\"message\":\"${exception.message}\"}"
                      - setHeader:
                          name: CamelHttpResponseCode
                          constant: "400"
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: xml-schema-validate
  labels:
    platform.io/catalog-category: file-document
    platform.io/camel-component: validator
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/xml-schema-validate
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: xml-schema-validate
        from:
          uri: "file:{{input.dir}}/validate-xsd?include=.*\\.xml&move=.validated"
          steps:
            - log:
                message: "Validating XML against XSD schema: ${header.CamelFileName}"
            - doTry:
                steps:
                  - to:
                      uri: "validator:schemas/order.xsd"
                  - log:
                      message: "XML validation passed for ${header.CamelFileName}"
                  - to:
                      uri: "file:{{output.dir}}/xsd-valid"
                doCatch:
                  - exception:
                      - org.apache.camel.ValidationException
                    steps:
                      - log:
                          message: "XML validation FAILED for ${header.CamelFileName}: ${exception.message}"
                      - to:
                          uri: "file:{{output.dir}}/xsd-invalid"
