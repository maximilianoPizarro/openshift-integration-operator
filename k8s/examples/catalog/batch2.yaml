apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: email-to-jira
  labels:
    platform.io/catalog-category: social-communication
    platform.io/camel-component: mail
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/email-to-jira
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: email-to-jira
        from:
          uri: "imaps://imap.company.com:993?username={{mail.username}}&password={{mail.password}}&unseen=true&delay=60000"
          steps:
            - log:
                message: "Creating JIRA ticket from email: ${header.Subject}"
            - setHeader:
                name: IssueTypeName
                constant: "Task"
            - setHeader:
                name: ProjectKey
                constant: "SUPPORT"
            - setBody:
                simple: "{\"fields\":{\"project\":{\"key\":\"SUPPORT\"},\"summary\":\"${header.Subject}\",\"issuetype\":{\"name\":\"Task\"},\"description\":\"${body}\"}}"
            - to:
                uri: "jira:createIssue?jiraUrl={{jira.url}}&username={{jira.user}}&password={{jira.token}}"
