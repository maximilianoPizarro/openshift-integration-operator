apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: kubernetes-pod-watch
  labels:
    platform.io/catalog-category: devops-cicd
    platform.io/camel-component: kubernetes
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/kubernetes-pod-watch
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: kubernetes-pod-watch
        from:
          uri: "kubernetes-pods:///?kubernetesClient=#kubernetesClient&namespace=production&operation=watchPods"
          steps:
            - log:
                message: "Pod event in production: ${body.metadata.name} status=${body.status.phase}"
            - choice:
                when:
                  - simple: "${body.status.phase} == 'Failed'"
                    steps:
                      - setBody:
                          simple: ":warning: Pod *${body.metadata.name}* entered Failed state in production namespace"
                      - to:
                          uri: "slack:#k8s-alerts?webhookUrl={{slack.webhook.url}}"
            - to:
                uri: "kafka:k8s-pod-events?brokers={{kafka.brokers}}"
---
