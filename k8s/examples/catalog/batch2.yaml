apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: process-manager
  labels:
    platform.io/catalog-category: eip-patterns
    platform.io/camel-component: direct
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/process-manager
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: process-manager
        from:
          uri: "kafka:order-lifecycle?brokers={{kafka.brokers}}&groupId=process-mgr"
          steps:
            - unmarshal:
                json: {}
            - log:
                message: "Process manager handling order ${body[orderId]} at step ${body[step]}"
            - choice:
                when:
                  - simple: "${body[step]} == 'VALIDATE'"
                    steps:
                      - to:
                          uri: "direct:validate-order"
                  - simple: "${body[step]} == 'PAYMENT'"
                    steps:
                      - to:
                          uri: "direct:process-payment"
                  - simple: "${body[step]} == 'FULFILL'"
                    steps:
                      - to:
                          uri: "direct:fulfill-order"
                  - simple: "${body[step]} == 'SHIP'"
                    steps:
                      - to:
                          uri: "direct:ship-order"
---
