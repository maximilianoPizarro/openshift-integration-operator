apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: aws-dynamodb
  labels:
    platform.io/catalog-category: data-storage
    platform.io/camel-component: aws2-ddb
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/aws-dynamodb
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # CRUD operations against AWS DynamoDB
    - route:
        id: aws-dynamodb-put-route
        from:
          uri: "direct:dynamo-put"
          steps:
            - log:
                message: "DynamoDB PutItem: ${body}"
            - setHeader:
                name: CamelAwsDdbOperation
                constant: PutItem
            - setHeader:
                name: CamelAwsDdbItem
                groovy: |
                  import software.amazon.awssdk.services.dynamodb.model.AttributeValue
                  def item = [:]
                  item['pk'] = AttributeValue.builder().s(exchange.in.getHeader('itemId')).build()
                  item['data'] = AttributeValue.builder().s(exchange.in.body).build()
                  item['timestamp'] = AttributeValue.builder().s(new Date().toInstant().toString()).build()
                  return item
            - to:
                uri: "aws2-ddb:integration-table"
                parameters:
                  region: us-east-1
                  useDefaultCredentialsProvider: "true"
                  operation: PutItem
            - log:
                message: "DynamoDB item stored"
---
