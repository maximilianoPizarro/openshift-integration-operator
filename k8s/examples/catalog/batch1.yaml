    # JPA-based entity polling and persistence
    - route:
        id: jpa-crud-poll-route
        from:
          uri: "jpa:com.example.entity.Task"
          parameters:
            consumeDelete: "false"
            consumeLockEntity: "true"
            delay: "5000"
            query: "select t from Task t where t.status = 'PENDING'"
            maximumResults: "20"
          steps:
            - log:
                message: "JPA entity: id=${body.id}, title=${body.title}"
            - to:
                uri: "bean:taskProcessor"
                parameters:
                  method: "process"
            - to:
                uri: "jpa:com.example.entity.Task"
                parameters:
                  usePersist: "false"
            - log:
                message: "Task ${body.id} updated to ${body.status}"
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: mongodb-crud
  labels:
    platform.io/catalog-category: data-storage
    platform.io/camel-component: mongodb
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/mongodb-crud
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # CRUD operations against MongoDB with change stream tailing
    - route:
        id: mongodb-insert-route
        from:
          uri: "direct:mongo-insert"
          steps:
            - log:
                message: "Inserting into MongoDB: ${body}"
            - to:
                uri: "mongodb:mongoClient"
                parameters:
                  database: integration_db
                  collection: events
                  operation: insert
            - log:
                message: "Inserted with _id=${body[_id]}"
    - route:
        id: mongodb-changestream-route
        from:
          uri: "mongodb:mongoClient"
          parameters:
            database: integration_db
            collection: events
            consumerType: changeStreams
          steps:
            - log:
                message: "MongoDB change: operation=${body[operationType]}, docId=${body[documentKey][_id]}"
            - choice:
                when:
                  - simple: "${body[operationType]} == 'insert'"
                    steps:
                      - log:
                          message: "New document: ${body[fullDocument]}"
                  - simple: "${body[operationType]} == 'update'"
                    steps:
                      - log:
                          message: "Updated fields: ${body[updateDescription][updatedFields]}"
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
