  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Redis cache-aside pattern with TTL
    - route:
        id: redis-cache-route
        from:
          uri: "direct:redis-get"
          steps:
            - setHeader:
                name: CamelRedis.Command
                constant: GET
            - setHeader:
                name: CamelRedis.Key
                simple: "integration:${headers[cacheKey]}"
            - to:
                uri: "spring-redis://redis-server:6379"
            - choice:
                when:
                  - simple: "${body} != null"
                    steps:
                      - log:
                          message: "Redis cache hit: ${headers[cacheKey]}"
                otherwise:
                  steps:
                    - log:
                        message: "Redis cache miss: ${headers[cacheKey]}"
                    - to:
                        uri: "direct:fetch-from-source"
                    - setHeader:
                        name: CamelRedis.Command
                        constant: SETEX
                    - setHeader:
                        name: CamelRedis.Key
                        simple: "integration:${headers[cacheKey]}"
                    - setHeader:
                        name: CamelRedis.Timeout
                        constant: "600"
                    - to:
