            - setHeader:
                name: CamelFileName
                simple: "export_${date:now:yyyyMMdd_HHmmss}.csv"
            - log:
                message: "Uploading via SFTP: ${headers[CamelFileName]}"
            - to:
                uri: "sftp:sftp.example.com:22/incoming"
                parameters:
                  username: "{{sftp.user}}"
                  privateKeyFile: "/secrets/sftp/id_rsa"
                  strictHostKeyChecking: "no"
                  tempPrefix: ".tmp_"
                  tempFileName: "${headers[CamelFileName]}.tmp"
                  chmod: "0644"
            - log:
                message: "SFTP upload complete: ${headers[CamelFileName]}"
