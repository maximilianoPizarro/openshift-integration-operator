apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: file-processor
  labels:
    platform.io/catalog-category: data-storage
    platform.io/camel-component: file
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/file-processor
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Watches a directory for new files and processes them
    - route:
        id: file-processor-route
        from:
          uri: "file:/data/incoming"
          parameters:
            noop: "false"
            move: ".done"
            moveFailed: ".error"
            readLock: changed
            readLockCheckInterval: "1000"
            include: ".*\\.(json|csv|xml)"
            sortBy: "file:modified"
          steps:
            - log:
                message: "Processing file: ${headers[CamelFileName]}, size=${headers[CamelFileLength]} bytes"
            - choice:
                when:
                  - simple: "${headers[CamelFileName]} regex '.*\\.json$'"
                    steps:
                      - unmarshal:
                          json:
                            library: Jackson
                      - to:
                          uri: "direct:process-json-file"
                  - simple: "${headers[CamelFileName]} regex '.*\\.csv$'"
                    steps:
                      - unmarshal:
                          csv: {}
                      - to:
                          uri: "direct:process-csv-file"
                  - simple: "${headers[CamelFileName]} regex '.*\\.xml$'"
                    steps:
                      - unmarshal:
                          jaxb:
                            contextPath: "com.example.model"
                      - to:
                          uri: "direct:process-xml-file"
            - log:
                message: "File ${headers[CamelFileName]} processed successfully"
---
