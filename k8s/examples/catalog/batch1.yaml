            brokers: "my-cluster-kafka-bootstrap:9092"
            groupId: filter-group
          steps:
            - unmarshal:
                json:
                  library: Jackson
            - log:
                message: "Sensor reading: sensor=${body[sensorId]}, value=${body[value]}"
