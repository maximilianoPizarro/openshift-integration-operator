apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: data-format-json
  labels:
    platform.io/catalog-category: transformation
    platform.io/camel-component: dataformat
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/data-format-json
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # JSON marshalling/unmarshalling with Jackson
    - route:
        id: data-format-json-route
        from:
          uri: "direct:json-processing"
          steps:
            - log:
                message: "Raw input: ${body}"
            - unmarshal:
                json:
                  library: Jackson
                  unmarshalType: "java.util.Map"
            - log:
                message: "Unmarshalled: type=${body[type]}, count=${body[items].size()}"
            - setBody:
                groovy: |
                  def result = [:]
                  result.processedAt = new Date().toInstant().toString()
                  result.itemCount = body.items.size()
                  result.summary = body.items.collect { it.name }.join(', ')
                  return result
            - marshal:
                json:
                  library: Jackson
                  prettyPrint: "true"
            - log:
                message: "Marshalled output: ${body}"
---
