apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: splitter-aggregator
  labels:
    platform.io/catalog-category: transformation
    platform.io/camel-component: eip
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/splitter-aggregator
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Splits a batch message, processes items individually, then aggregates results
    - route:
        id: splitter-aggregator-route
        from:
          uri: "direct:batch-process"
          steps:
            - log:
                message: "Splitting batch of ${body[items].size()} items"
            - split:
                jsonpath: "$.items[*]"
                aggregationStrategy: "#groupedBodyStrategy"
                parallelProcessing: "true"
                steps:
                  - log:
                      message: "Processing item: ${body[id]}"
                  - to:
                      uri: "bean:itemProcessor"
                      parameters:
                        method: "process"
                  - setBody:
                      simple: '{"id":"${body[id]}","status":"processed","processedAt":"${date:now:ISO}"}'
            - log:
                message: "All items processed, aggregated result: ${body}"
            - marshal:
                json:
                  library: Jackson
            - to:
                uri: "direct:batch-complete"
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: multicast-parallel
  labels:
    platform.io/catalog-category: transformation
    platform.io/camel-component: eip
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/multicast-parallel
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Sends the same message to multiple endpoints in parallel
    - route:
        id: multicast-parallel-route
        from:
          uri: "kafka:order-completed"
          parameters:
            brokers: "my-cluster-kafka-bootstrap:9092"
            groupId: multicast-group
          steps:
            - log:
                message: "Order completed, multicasting: ${body}"
            - unmarshal:
                json:
                  library: Jackson
            - multicast:
                parallelProcessing: "true"
                stopOnException: "false"
                steps:
                  - to:
                      uri: "direct:send-confirmation-email"
                  - to:
                      uri: "direct:update-inventory"
                  - to:
                      uri: "direct:notify-warehouse"
                  - to:
                      uri: "direct:update-analytics"
            - log:
                message: "Multicast complete for order ${body[orderId]}"
