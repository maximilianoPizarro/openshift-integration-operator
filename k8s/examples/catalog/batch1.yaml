  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/aws-kinesis-stream
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Produces and consumes records from AWS Kinesis Data Streams
    - route:
        id: aws-kinesis-producer-route
        from:
          uri: "direct:kinesis-put"
          steps:
            - setHeader:
                name: CamelAwsKinesisPartitionKey
                simple: "${exchangeId}"
            - log:
                message: "Putting record to Kinesis: partitionKey=${headers[CamelAwsKinesisPartitionKey]}"
            - to:
                uri: "aws2-kinesis:integration-stream"
                parameters:
                  region: us-east-1
                  useDefaultCredentialsProvider: "true"
            - log:
                message: "Kinesis record sent: sequenceNumber=${headers[CamelAwsKinesisSequenceNumber]}"
    - route:
        id: aws-kinesis-consumer-route
        from:
          uri: "aws2-kinesis:integration-stream"
          parameters:
            region: us-east-1
            useDefaultCredentialsProvider: "true"
            iteratorType: TRIM_HORIZON
            shardCount: "2"
          steps:
            - convertBodyTo:
                type: "java.lang.String"
            - log:
                message: "Kinesis record: shard=${headers[CamelAwsKinesisShardId]}, seq=${headers[CamelAwsKinesisSequenceNumber]}, body=${body}"
