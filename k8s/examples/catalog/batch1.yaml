apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: netty-http-server
  labels:
    platform.io/catalog-category: http-rest
    platform.io/camel-component: netty-http
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/netty-http-server
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # High-performance HTTP server using Netty for low-latency endpoints
    - route:
        id: netty-http-server-route
        from:
          uri: "netty-http:http://0.0.0.0:8888/api/data"
          parameters:
            keepAlive: "true"
            reuseAddress: "true"
            sync: "true"
            maxHeaderSize: "8192"
          steps:
            - log:
                message: "Netty request: method=${headers[CamelHttpMethod]}, uri=${headers[CamelHttpUri]}"
            - choice:
                when:
                  - simple: "${headers[CamelHttpMethod]} == 'GET'"
                    steps:
                      - setBody:
                          constant: '{"message":"Hello from Netty","timestamp":"${date:now:ISO}"}'
                  - simple: "${headers[CamelHttpMethod]} == 'POST'"
                    steps:
                      - log:
                          message: "POST body: ${body}"
                      - setBody:
                          simple: '{"received":true,"id":"${exchangeId}"}'
                otherwise:
                  steps:
                    - setHeader:
                        name: CamelHttpResponseCode
                        constant: "405"
                    - setBody:
                        constant: '{"error":"Method not allowed"}'
            - setHeader:
                name: Content-Type
                constant: "application/json"
