  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/http-client-post
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Posts data to an external API endpoint with retry
    - route:
        id: http-client-post-route
        from:
          uri: "direct:send-data"
          steps:
            - setHeader:
                name: CamelHttpMethod
                constant: POST
            - setHeader:
                name: Content-Type
                constant: "application/json"
            - setHeader:
                name: Authorization
                simple: "Bearer {{api.token}}"
            - log:
                message: "Posting data: ${body}"
            - to:
                uri: "http:api.example.com/v1/events"
                parameters:
                  httpMethod: POST
                  connectTimeout: "5000"
                  socketTimeout: "30000"
            - log:
                message: "POST response: status=${headers[CamelHttpResponseCode]}"
            - choice:
                when:
                  - simple: "${headers[CamelHttpResponseCode]} != 200"
                    steps:
                      - log:
                          message: "POST failed with ${headers[CamelHttpResponseCode]}"
                          loggingLevel: ERROR
                      - throwException:
                          exceptionType: "java.lang.RuntimeException"
                          message: "HTTP POST failed"
