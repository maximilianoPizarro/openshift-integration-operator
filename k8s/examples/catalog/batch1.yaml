                      - unmarshal:
                          json:
                            library: Jackson
                      - to:
                          uri: "direct:process-json"
                  - simple: "${headers[CamelAwsS3Key]} regex '.*\\.csv$'"
                    steps:
                      - unmarshal:
                          csv: {}
                      - to:
