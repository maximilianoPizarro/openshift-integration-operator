apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: nats-pubsub
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: nats
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/nats-pubsub
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Subscribes to NATS subjects and republishes to another subject
    - route:
        id: nats-pubsub-route
        from:
          uri: "nats:events.incoming"
          parameters:
            servers: "nats://nats-server:4222"
            queueName: integration-workers
            maxMessages: "100"
          steps:
            - log:
                message: "NATS event received on subject=${headers[CamelNatsSubject]}: ${body}"
            - setBody:
                simple: '{"original":${body},"processed":true,"processedAt":"${date:now:ISO}"}'
            - to:
                uri: "nats:events.processed"
                parameters:
                  servers: "nats://nats-server:4222"
            - log:
                message: "Republished to events.processed"
