apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: azure-servicebus
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: azure-servicebus
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/azure-servicebus
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Consumes from Azure Service Bus queue and processes messages
    - route:
        id: azure-servicebus-route
        from:
          uri: "azure-servicebus:integration-queue"
          parameters:
            serviceBusType: queue
            connectionString: "{{azure.servicebus.connectionString}}"
            peekMode: "false"
          steps:
            - log:
                message: "Azure Service Bus: messageId=${headers[CamelAzureServiceBusMessageId]}, body=${body}"
            - unmarshal:
                json:
                  library: Jackson
            - setHeader:
                name: correlationId
                simple: "${headers[CamelAzureServiceBusCorrelationId]}"
            - choice:
                when:
                  - simple: "${body[action]} == 'process'"
                    steps:
                      - to:
                          uri: "direct:process-message"
                  - simple: "${body[action]} == 'archive'"
                    steps:
                      - to:
                          uri: "direct:archive-message"
                otherwise:
                  steps:
                    - log:
                        message: "Unknown action: ${body[action]}"
                        loggingLevel: WARN
---
