apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: pulsar-consumer
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: pulsar
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/pulsar-consumer
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Consumes messages from Apache Pulsar and routes by content
    - route:
        id: pulsar-consumer-route
        from:
          uri: "pulsar:persistent://public/default/events"
          parameters:
            subscriptionName: integration-sub
            subscriptionType: Shared
            consumerName: openshift-consumer
            numberOfConsumers: "3"
          steps:
            - log:
                message: "Pulsar message: key=${headers[CamelPulsarMessageKey]}, body=${body}"
            - unmarshal:
                json:
                  library: Jackson
            - choice:
                when:
                  - simple: "${body[priority]} == 'high'"
                    steps:
                      - log:
                          message: "High-priority event: ${body[type]}"
                      - to:
                          uri: "direct:high-priority-handler"
                  - simple: "${body[priority]} == 'low'"
                    steps:
                      - to:
                          uri: "direct:low-priority-handler"
                otherwise:
                  steps:
                    - to:
                        uri: "log:io.platform.pulsar.default"
---
