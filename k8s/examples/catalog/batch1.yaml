    clusters:
      - local
  kaotoDesign: |
    # HTTP proxy/gateway using Vert.x HTTP client for non-blocking I/O
    - route:
        id: vertx-http-proxy-route
        from:
          uri: "platform-http:/proxy/{path}"
          parameters:
            httpMethodRestrict: "GET,POST,PUT,DELETE"
          steps:
            - log:
                message: "Proxying ${headers[CamelHttpMethod]} /proxy/${headers[path]}"
            - setHeader:
                name: CamelHttpUri
                simple: "http://backend-service:8080/${headers[path]}"
            - removeHeader:
                name: path
            - to:
                uri: "vertx-http:http://backend-service:8080"
