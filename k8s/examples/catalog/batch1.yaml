apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: spring-rabbitmq
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: spring-rabbitmq
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/spring-rabbitmq
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Consumes from RabbitMQ and routes based on routing key
    - route:
        id: spring-rabbitmq-route
        from:
          uri: "spring-rabbitmq:orders-exchange"
          parameters:
            queues: "orders.new"
            routingKey: "order.created"
            autoDeclare: "true"
            connectionFactory: "#rabbitConnectionFactory"
          steps:
            - log:
                message: "RabbitMQ order: routing-key=${headers[CamelSpringRabbitmqRoutingKey]}, body=${body}"
            - unmarshal:
                json:
                  library: Jackson
            - choice:
                when:
                  - simple: "${body[amount]} > 1000"
                    steps:
                      - log:
                          message: "High-value order ${body[orderId]}: $${body[amount]}"
                      - to:
                          uri: "spring-rabbitmq:orders-exchange"
                          parameters:
                            routingKey: "order.high-value"
                otherwise:
                  steps:
                    - to:
                        uri: "spring-rabbitmq:orders-exchange"
                        parameters:
                          routingKey: "order.standard"
---
apiVersion: platform.io/v1alpha1
