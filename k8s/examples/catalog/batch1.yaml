apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: content-based-router
  labels:
    platform.io/catalog-category: transformation
    platform.io/camel-component: eip
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/content-based-router
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Routes messages to different endpoints based on content
    - route:
        id: content-based-router-route
        from:
          uri: "kafka:incoming-events"
          parameters:
            brokers: "my-cluster-kafka-bootstrap:9092"
            groupId: cbr-group
          steps:
            - unmarshal:
                json:
                  library: Jackson
            - log:
                message: "CBR input: type=${body[eventType]}, priority=${body[priority]}"
            - choice:
                when:
                  - simple: "${body[eventType]} == 'ORDER'"
                    steps:
                      - log:
                          message: "Routing to order processing"
                      - to:
                          uri: "kafka:orders-processing"
                          parameters:
                            brokers: "my-cluster-kafka-bootstrap:9092"
                  - simple: "${body[eventType]} == 'PAYMENT'"
                    steps:
                      - log:
                          message: "Routing to payment processing"
                      - to:
                          uri: "kafka:payments-processing"
                          parameters:
                            brokers: "my-cluster-kafka-bootstrap:9092"
                  - simple: "${body[eventType]} == 'NOTIFICATION'"
                    steps:
                      - log:
                          message: "Routing to notification service"
                      - to:
                          uri: "kafka:notifications"
                          parameters:
                            brokers: "my-cluster-kafka-bootstrap:9092"
                otherwise:
                  steps:
                    - log:
                        message: "Unknown event type: ${body[eventType]}, sending to DLQ"
                        loggingLevel: WARN
                    - to:
                        uri: "kafka:dead-letter-queue"
                        parameters:
                          brokers: "my-cluster-kafka-bootstrap:9092"
---
apiVersion: platform.io/v1alpha1
