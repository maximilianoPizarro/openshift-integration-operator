apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: timer-log
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: timer
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/timer-log
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Simple heartbeat timer that logs a message every 5 seconds
    - route:
        id: timer-log-route
        from:
          uri: "timer:heartbeat"
          parameters:
            period: "5000"
            timerName: heartbeat
          steps:
            - setBody:
                simple: "Heartbeat at ${date:now:yyyy-MM-dd HH:mm:ss}"
            - log:
                message: "${body}"
                loggingLevel: INFO
                logName: io.platform.heartbeat
            - to:
                uri: "log:io.platform.heartbeat"
                parameters:
                  level: INFO
                  showAll: "true"
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: kafka-producer
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: kafka
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/kafka-producer
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Produces messages to a Kafka topic on a timer schedule
    - route:
        id: kafka-producer-route
        from:
          uri: "timer:kafka-tick"
          parameters:
            period: "10000"
          steps:
            - setBody:
                simple: '{"event":"order-created","orderId":"${exchangeId}","timestamp":"${date:now:ISO}"}'
            - setHeader:
                name: kafka.KEY
                simple: "${exchangeId}"
            - log:
                message: "Producing to Kafka: ${body}"
            - to:
                uri: "kafka:orders-topic"
                parameters:
                  brokers: "my-cluster-kafka-bootstrap:9092"
                  securityProtocol: SASL_SSL
                  saslMechanism: SCRAM-SHA-512
                  serializerClass: org.apache.kafka.common.serialization.StringSerializer
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: kafka-consumer-log
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: kafka
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/kafka-consumer-log
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Consumes messages from a Kafka topic and logs them
    - route:
        id: kafka-consumer-log-route
        from:
          uri: "kafka:orders-topic"
          parameters:
            brokers: "my-cluster-kafka-bootstrap:9092"
            groupId: integration-consumer-group
            autoOffsetReset: earliest
            consumersCount: "3"
            securityProtocol: SASL_SSL
            saslMechanism: SCRAM-SHA-512
          steps:
            - log:
                message: "Received from Kafka [partition=${headers[kafka.PARTITION]}, offset=${headers[kafka.OFFSET]}]: ${body}"
            - choice:
                when:
                  - simple: "${body} contains 'error'"
                    steps:
                      - to:
                          uri: "log:io.platform.errors"
                          parameters:
                            level: ERROR
                otherwise:
                  steps:
                    - to:
                        uri: "log:io.platform.orders"
                        parameters:
                          level: INFO
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: amqp-to-log
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: amqp
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/amqp-to-log
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Consumes AMQP 1.0 messages from a queue and logs with metadata
    - route:
        id: amqp-to-log-route
        from:
          uri: "amqp:queue:incoming.events"
          parameters:
            connectionFactory: "#amqpConnectionFactory"
            acknowledgementModeName: CLIENT_ACKNOWLEDGE
          steps:
            - log:
                message: "AMQP message received: ${body}"
            - unmarshal:
                json:
                  library: Jackson
            - setHeader:
                name: processedAt
                simple: "${date:now:ISO}"
            - log:
                message: "Processed event type=${body[eventType]}, id=${body[id]}"
            - to:
                uri: "log:io.platform.amqp"
                parameters:
                  level: INFO
                  showHeaders: "true"
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: jms-bridge
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: jms
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/jms-bridge
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Bridges messages between two JMS queues with transformation
    - route:
        id: jms-bridge-route
        from:
          uri: "jms:queue:source.queue"
          parameters:
            connectionFactory: "#sourceConnectionFactory"
            concurrentConsumers: "5"
            maxConcurrentConsumers: "10"
          steps:
            - log:
                message: "Bridging message from source: ${headers[JMSMessageID]}"
            - setHeader:
                name: bridgedAt
                simple: "${date:now:ISO}"
            - setHeader:
                name: sourceQueue
                constant: "source.queue"
            - marshal:
                json:
                  library: Jackson
            - to:
                uri: "jms:queue:destination.queue"
                parameters:
                  connectionFactory: "#destConnectionFactory"
                  deliveryPersistent: "true"
                  timeToLive: "3600000"
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: activemq-consumer
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: activemq
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/activemq-consumer
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Consumes from ActiveMQ Artemis with retry and DLQ handling
    - route:
        id: activemq-consumer-route
        from:
          uri: "activemq:queue:orders.incoming"
          parameters:
            connectionFactory: "#artemisConnectionFactory"
            concurrentConsumers: "3"
            transacted: "true"
          steps:
            - log:
                message: "ActiveMQ order received: ${body}"
            - doTry:
                steps:
                  - unmarshal:
                      json:
                        library: Jackson
                  - setHeader:
                      name: orderId
                      simple: "${body[orderId]}"
                  - to:
                      uri: "bean:orderValidationService"
                      parameters:
                        method: validate
                  - log:
                      message: "Order ${headers[orderId]} validated successfully"
                doCatch:
                  - exception:
                      - java.lang.Exception
                    steps:
                      - log:
                          message: "Failed to process order: ${exception.message}"
                          loggingLevel: ERROR
                      - to:
                          uri: "activemq:queue:orders.dlq"
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: mqtt-to-kafka
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: paho-mqtt5
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/mqtt-to-kafka
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Bridges IoT sensor data from MQTT to Kafka for stream processing
    - route:
        id: mqtt-to-kafka-route
        from:
          uri: "paho-mqtt5:sensors/+/telemetry"
          parameters:
            brokerUrl: "tcp://mqtt-broker:1883"
            qos: "1"
            clientId: "openshift-mqtt-bridge"
            cleanStart: "true"
          steps:
            - log:
                message: "MQTT telemetry from topic=${headers[CamelMqttTopic]}: ${body}"
            - setHeader:
                name: kafka.KEY
                simple: "${headers[CamelMqttTopic]}"
            - setHeader:
                name: sensorId
                simple: "${headers[CamelMqttTopic].replaceAll('sensors/', '').replaceAll('/telemetry', '')}"
            - marshal:
                json:
                  library: Jackson
            - to:
                uri: "kafka:iot-telemetry"
                parameters:
                  brokers: "my-cluster-kafka-bootstrap:9092"
                  serializerClass: org.apache.kafka.common.serialization.StringSerializer
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: mqtt-publish
  labels:
    platform.io/catalog-category: messaging
