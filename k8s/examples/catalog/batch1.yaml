apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: seda-pipeline
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: seda
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/seda-pipeline
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # In-memory async pipeline using SEDA queues for parallel processing
    - route:
        id: seda-pipeline-ingest
        from:
          uri: "timer:data-generator"
          parameters:
            period: "1000"
          steps:
            - setBody:
                simple: '{"id":"${exchangeId}","value":${random(1,1000)},"ts":"${date:now:ISO}"}'
            - to:
                uri: "seda:stage1"
                parameters:
                  size: "1000"
                  concurrentConsumers: "5"
                  blockWhenFull: "true"
    - route:
        id: seda-pipeline-process
        from:
          uri: "seda:stage1"
          parameters:
            concurrentConsumers: "5"
          steps:
            - log:
                message: "Stage 1 processing: ${body}"
            - setHeader:
                name: stage1Complete
                constant: "true"
            - to:
                uri: "seda:stage2"
    - route:
        id: seda-pipeline-output
        from:
          uri: "seda:stage2"
          parameters:
            concurrentConsumers: "3"
          steps:
            - log:
                message: "Stage 2 final output: ${body}"
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: direct-chain
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: direct
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/direct-chain
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Chains multiple direct routes for synchronous in-process messaging
    - route:
        id: direct-chain-entry
        from:
          uri: "timer:trigger"
          parameters:
            period: "5000"
          steps:
            - setBody:
                simple: '{"step":"start","exchangeId":"${exchangeId}"}'
            - log:
                message: "Starting chain: ${body}"
            - to:
                uri: "direct:validate"
    - route:
        id: direct-chain-validate
        from:
          uri: "direct:validate"
          steps:
            - log:
                message: "Validating: ${body}"
            - setHeader:
                name: validated
                constant: "true"
            - to:
                uri: "direct:enrich"
    - route:
        id: direct-chain-enrich
        from:
          uri: "direct:enrich"
          steps:
            - log:
                message: "Enriching: ${body}"
            - setBody:
                simple: '${body.replaceAll("start", "enriched")}'
            - log:
                message: "Chain complete: ${body}"
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: disruptor-async
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: disruptor
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/disruptor-async
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # High-throughput async processing using LMAX Disruptor ring buffer
    - route:
        id: disruptor-async-route
        from:
          uri: "timer:high-throughput"
          parameters:
            period: "100"
          steps:
            - setBody:
                simple: '{"event":"tick","seq":"${exchangeProperty.CamelTimerCounter}","ts":"${date:now:ISO}"}'
            - to:
                uri: "disruptor:fast-queue"
                parameters:
                  size: "4096"
                  concurrentConsumers: "8"
                  producerType: Multi
                  waitStrategy: Blocking
    - route:
        id: disruptor-async-consumer
        from:
          uri: "disruptor:fast-queue"
          parameters:
            concurrentConsumers: "8"
          steps:
            - log:
                message: "Disruptor processed: ${body}"
                loggingLevel: DEBUG
