apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: google-functions
  labels:
    platform.io/catalog-category: cloud-services
    platform.io/camel-component: google-functions
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/google-functions
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Invokes a Google Cloud Function
    - route:
        id: google-functions-route
        from:
          uri: "direct:call-function"
          steps:
            - log:
                message: "Invoking GCP function: ${headers[functionName]}"
            - marshal:
                json:
                  library: Jackson
            - to:
                uri: "google-functions:data-processor"
                parameters:
                  project: my-gcp-project
                  location: us-central1
                  functionName: data-processor
                  operation: callFunction
            - unmarshal:
                json:
                  library: Jackson
            - log:
                message: "Function response: ${body}"
            - choice:
                when:
                  - simple: "${body[success]} == true"
                    steps:
                      - log:
                          message: "Function executed successfully: ${body[result]}"
                otherwise:
                  steps:
                    - log:
                        message: "Function error: ${body[error]}"
                        loggingLevel: ERROR
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: ibm-cos
  labels:
    platform.io/catalog-category: cloud-services
    platform.io/camel-component: aws2-s3
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/ibm-cos
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Stores and retrieves objects from IBM Cloud Object Storage (S3-compatible)
    - route:
        id: ibm-cos-upload-route
        from:
          uri: "direct:ibm-cos-upload"
          steps:
            - setHeader:
                name: CamelAwsS3Key
                simple: "integration/${date:now:yyyy/MM/dd}/${exchangeId}.json"
            - setHeader:
                name: CamelAwsS3ContentType
                constant: "application/json"
            - log:
                message: "Uploading to IBM COS: ${headers[CamelAwsS3Key]}"
            - to:
                uri: "aws2-s3:integration-bucket"
                parameters:
                  region: us-south
                  overrideEndpoint: "https://s3.us-south.cloud-object-storage.appdomain.cloud"
                  accessKey: "{{ibm.cos.accessKey}}"
                  secretKey: "{{ibm.cos.secretKey}}"
                  operation: putObject
            - log:
                message: "IBM COS upload complete"
    - route:
        id: ibm-cos-poll-route
        from:
          uri: "aws2-s3:integration-inbox"
          parameters:
            region: us-south
            overrideEndpoint: "https://s3.us-south.cloud-object-storage.appdomain.cloud"
            accessKey: "{{ibm.cos.accessKey}}"
            secretKey: "{{ibm.cos.secretKey}}"
            deleteAfterRead: "true"
            prefix: "incoming/"
            delay: "30000"
          steps:
            - log:
                message: "IBM COS object: ${headers[CamelAwsS3Key]}"
            - convertBodyTo:
                type: "java.lang.String"
            - to:
                uri: "direct:process-cos-object"
---
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: salesforce-query
  labels:
    platform.io/catalog-category: cloud-services
    platform.io/camel-component: salesforce
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/salesforce-query
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Queries Salesforce objects and syncs data
    - route:
        id: salesforce-query-route
        from:
          uri: "timer:sf-sync"
          parameters:
            period: "300000"
          steps:
            - log:
                message: "Querying Salesforce for recent opportunities"
            - to:
                uri: "salesforce:query"
                parameters:
                  sObjectQuery: "SELECT Id, Name, Amount, StageName, CloseDate, Account.Name FROM Opportunity WHERE LastModifiedDate > LAST_N_HOURS:1 AND StageName != 'Closed Won' ORDER BY Amount DESC LIMIT 50"
                  rawPayload: "true"
                  clientId: "{{salesforce.clientId}}"
                  clientSecret: "{{salesforce.clientSecret}}"
                  userName: "{{salesforce.username}}"
                  password: "{{salesforce.password}}"
                  loginUrl: "https://login.salesforce.com"
            - unmarshal:
                json:
                  library: Jackson
            - log:
                message: "Salesforce returned ${body[totalSize]} opportunities"
            - split:
                jsonpath: "$.records[*]"
                steps:
                  - log:
                      message: "Opportunity: ${body[Name]}, Amount=$${body[Amount]}, Stage=${body[StageName]}"
                  - marshal:
                      json:
                        library: Jackson
                  - to:
                      uri: "kafka:salesforce-opportunities"
                      parameters:
                        brokers: "my-cluster-kafka-bootstrap:9092"
