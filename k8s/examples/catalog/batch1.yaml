  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/aws-athena-query
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Executes SQL queries against AWS Athena and retrieves results
    - route:
        id: aws-athena-query-route
        from:
          uri: "timer:athena-report"
          parameters:
            period: "3600000"
          steps:
            - log:
                message: "Executing Athena query for hourly report"
            - setBody:
                constant: "SELECT date_trunc('hour', event_time) as hour, count(*) as event_count, avg(duration_ms) as avg_duration FROM integration_logs.events WHERE event_time > current_timestamp - interval '1' hour GROUP BY 1 ORDER BY 1"
            - to:
                uri: "aws2-athena:integration-query"
                parameters:
                  region: us-east-1
                  useDefaultCredentialsProvider: "true"
                  database: integration_logs
                  outputLocation: "s3://athena-results/integration/"
                  waitTimeout: "60000"
                  operation: startQueryExecutionAndGetResults
            - log:
                message: "Athena query complete: ${body}"
            - to:
                uri: "direct:process-athena-results"
---
