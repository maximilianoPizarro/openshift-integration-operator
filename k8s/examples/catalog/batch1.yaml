apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: google-calendar
  labels:
    platform.io/catalog-category: cloud-services
    platform.io/camel-component: google-calendar
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/google-calendar
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Polls Google Calendar for upcoming events and sends reminders
    - route:
        id: google-calendar-route
        from:
          uri: "google-calendar:events/list"
          parameters:
            calendarId: "primary"
            applicationName: "integration-operator"
            clientId: "{{google.calendar.clientId}}"
            clientSecret: "{{google.calendar.clientSecret}}"
            refreshToken: "{{google.calendar.refreshToken}}"
            delay: "300000"
            query: "integration"
          steps:
            - log:
                message: "Calendar events found: ${body.items.size()}"
            - split:
                simple: "${body.items}"
                steps:
                  - log:
                      message: "Event: ${body.summary} at ${body.start.dateTime}"
                  - choice:
                      when:
                        - simple: "${body.start.dateTime} < ${date:now+30m:ISO}"
                          steps:
                            - log:
                                message: "REMINDER: '${body.summary}' starts in < 30 minutes!"
                            - to:
                                uri: "direct:send-reminder"
---
