apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: infinispan-cache
  labels:
    platform.io/catalog-category: data-storage
    platform.io/camel-component: infinispan
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/infinispan-cache
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Caches API responses in Infinispan with TTL
    - route:
        id: infinispan-cache-route
        from:
          uri: "direct:cached-lookup"
          steps:
            - setHeader:
                name: CamelInfinispanKey
                simple: "cache:${headers[lookupKey]}"
            - to:
                uri: "infinispan:api-cache"
                parameters:
                  hosts: "infinispan-server:11222"
                  operation: GET
                  secure: "true"
                  username: "{{infinispan.user}}"
                  password: "{{infinispan.password}}"
            - choice:
                when:
                  - simple: "${body} != null"
                    steps:
                      - log:
                          message: "Cache HIT for ${headers[lookupKey]}"
                otherwise:
                  steps:
                    - log:
                        message: "Cache MISS for ${headers[lookupKey]}, fetching..."
                    - to:
                        uri: "http:api.example.com/v1/data/${headers[lookupKey]}"
                    - setHeader:
                        name: CamelInfinispanLifespanTime
                        constant: "300"
                    - setHeader:
                        name: CamelInfinispanLifespanTimeUnit
                        constant: "SECONDS"
                    - to:
                        uri: "infinispan:api-cache"
                        parameters:
                          hosts: "infinispan-server:11222"
                          operation: PUT
---
apiVersion: platform.io/v1alpha1
