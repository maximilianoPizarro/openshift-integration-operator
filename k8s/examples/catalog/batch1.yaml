apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: webhook-receiver
  labels:
    platform.io/catalog-category: http-rest
    platform.io/camel-component: webhook
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/webhook-receiver
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Receives GitHub/GitLab webhooks and routes by event type
    - route:
        id: webhook-receiver-route
        from:
          uri: "platform-http:/webhooks/git"
          parameters:
            httpMethodRestrict: POST
          steps:
            - log:
                message: "Webhook event: ${headers[X-GitHub-Event]}"
            - unmarshal:
                json:
                  library: Jackson
            - choice:
                when:
                  - simple: "${headers[X-GitHub-Event]} == 'push'"
                    steps:
                      - log:
                          message: "Push to ${body[repository][full_name]}, branch=${body[ref]}"
                      - to:
                          uri: "direct:handle-push"
                  - simple: "${headers[X-GitHub-Event]} == 'pull_request'"
                    steps:
                      - log:
                          message: "PR ${body[action]}: #${body[pull_request][number]}"
                      - to:
                          uri: "direct:handle-pr"
                  - simple: "${headers[X-GitHub-Event]} == 'issues'"
                    steps:
                      - to:
                          uri: "direct:handle-issue"
                otherwise:
                  steps:
                    - log:
                        message: "Unhandled webhook event: ${headers[X-GitHub-Event]}"
            - setBody:
                constant: '{"status":"received"}'
            - setHeader:
                name: Content-Type
                constant: "application/json"
---
