apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: knative-event
  labels:
    platform.io/catalog-category: messaging
    platform.io/camel-component: knative
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/knative-event
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Produces and consumes Knative CloudEvents
    - route:
        id: knative-event-producer
        from:
          uri: "timer:cloud-event-trigger"
          parameters:
            period: "15000"
          steps:
            - setBody:
                simple: '{"source":"integration-operator","type":"io.platform.event.created","data":{"id":"${exchangeId}"}}'
            - setHeader:
                name: ce-type
                constant: "io.platform.event.created"
            - setHeader:
                name: ce-source
                constant: "/integration-operator"
            - log:
                message: "Sending CloudEvent: ${body}"
            - to:
                uri: "knative:event/io.platform.event.created"
                parameters:
                  kind: InMemoryChannel
    - route:
        id: knative-event-consumer
        from:
          uri: "knative:event/io.platform.event.created"
          parameters:
            kind: InMemoryChannel
          steps:
            - log:
                message: "Received CloudEvent: type=${headers[ce-type]}, source=${headers[ce-source]}, body=${body}"
