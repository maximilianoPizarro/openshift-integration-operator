apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: servlet-filter
  labels:
    platform.io/catalog-category: http-rest
    platform.io/camel-component: servlet
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/servlet-filter
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # HTTP servlet endpoint with request filtering and validation
    - route:
        id: servlet-filter-route
        from:
          uri: "servlet:/api/submit"
          parameters:
            httpMethodRestrict: POST
            matchOnUriPrefix: "false"
          steps:
            - log:
                message: "Servlet request from ${headers[CamelHttpServletRequest].remoteAddr}"
            - choice:
                when:
                  - simple: "${headers[Content-Type]} not contains 'application/json'"
                    steps:
                      - setHeader:
                          name: CamelHttpResponseCode
                          constant: "415"
                      - setBody:
                          constant: '{"error":"Content-Type must be application/json"}'
                otherwise:
                  steps:
                    - unmarshal:
                        json:
                          library: Jackson
                    - to:
                        uri: "bean:requestValidator"
                        parameters:
                          method: "validate"
                    - setHeader:
                        name: CamelHttpResponseCode
                        constant: "202"
                    - setBody:
                        simple: '{"accepted":true,"id":"${exchangeId}"}'
            - setHeader:
                name: Content-Type
                constant: "application/json"
