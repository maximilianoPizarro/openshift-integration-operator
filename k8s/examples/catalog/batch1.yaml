apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: rest-api-crud
  labels:
    platform.io/catalog-category: http-rest
    platform.io/camel-component: rest
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/rest-api-crud
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    # Exposes a CRUD REST API for managing items
    - rest:
        id: rest-api-crud-definition
        path: /api/items
        consumes: application/json
        produces: application/json
        get:
          - id: get-all-items
            path: /
            to: "direct:getAll"
          - id: get-item-by-id
            path: "/{id}"
            to: "direct:getById"
        post:
          - id: create-item
            path: /
            to: "direct:createItem"
        put:
          - id: update-item
            path: "/{id}"
            to: "direct:updateItem"
        delete:
          - id: delete-item
            path: "/{id}"
            to: "direct:deleteItem"
    - route:
        id: rest-api-get-all
        from:
          uri: "direct:getAll"
          steps:
            - log:
                message: "GET /api/items"
            - to:
                uri: "bean:itemService"
                parameters:
                  method: "findAll"
            - marshal:
                json:
                  library: Jackson
    - route:
        id: rest-api-get-by-id
        from:
          uri: "direct:getById"
          steps:
            - log:
                message: "GET /api/items/${headers[id]}"
            - to:
                uri: "bean:itemService"
                parameters:
                  method: "findById(${headers[id]})"
            - marshal:
                json:
                  library: Jackson
---
