apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: transaction-saga
  labels:
    platform.io/catalog-category: finance-compliance
    platform.io/camel-component: direct
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/transaction-saga
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: transaction-saga
        from:
          uri: "platform-http:/api/transfer"
          parameters:
            httpMethodRestrict: POST
          steps:
            - unmarshal:
                json:
                  library: Jackson
            - log:
                message: "Starting transfer saga: ${body[fromAccount]} -> ${body[toAccount]}"
            - saga:
                propagation: REQUIRED
                steps:
                  - to:
                      uri: "direct:debit-account"
                  - to:
                      uri: "direct:credit-account"
                  - to:
                      uri: "direct:record-transfer"
            - setBody:
                constant: '{"status": "completed"}'
