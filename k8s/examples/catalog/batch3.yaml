                  - to:
                      uri: "http://target-service:8080/ping"
                  - setBody:
                      simple: "INSERT INTO uptime_log (service, status, response_time, checked_at) VALUES ('target-service', 'UP', ${headers.CamelHttpResponseTime}, NOW())"
