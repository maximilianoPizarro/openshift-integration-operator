apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: mqtt-sensor-data
  labels:
    platform.io/catalog-category: iot-industrial
    platform.io/camel-component: paho-mqtt5
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/mqtt-sensor-data
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: mqtt-sensor-data
        from:
          uri: "paho-mqtt5:sensors/temperature"
          parameters:
            brokerUrl: tcp://mqtt-broker:1883
            qos: 1
          steps:
            - unmarshal:
                json:
                  library: Jackson
            - log:
                message: "Received sensor data: ${body}"
            - setHeader:
                name: CamelInfluxDbMeasurement
                constant: sensor_readings
            - to:
                uri: "influxdb2://influx-server:8086"
                parameters:
                  bucket: iot_data
                  org: myorg
---
