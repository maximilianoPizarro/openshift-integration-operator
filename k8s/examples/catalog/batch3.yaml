apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: compliance-check
  labels:
    platform.io/catalog-category: finance-compliance
    platform.io/camel-component: bean
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/compliance-check
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: compliance-check
        from:
          uri: "kafka:transaction-events"
          parameters:
            brokers: kafka-broker:9092
            groupId: compliance-checker
          steps:
            - unmarshal:
                json:
                  library: Jackson
            - log:
                message: "Compliance check for transaction: ${body[transactionId]}"
            - to:
                uri: "bean:complianceRuleEngine?method=evaluate"
            - choice:
                when:
                  - simple: "${body[compliant]} == false"
                    steps:
                      - to:
                          uri: "kafka:compliance-violations"
                otherwise:
                  steps:
                    - to:
                        uri: "kafka:compliant-transactions"
