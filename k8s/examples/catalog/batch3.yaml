apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: fhir-patient-query
  labels:
    platform.io/catalog-category: iot-industrial
    platform.io/camel-component: fhir
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/fhir-patient-query
