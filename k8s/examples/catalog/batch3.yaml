apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: industrial-etl
  labels:
    platform.io/catalog-category: iot-industrial
    platform.io/camel-component: sql
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/industrial-etl
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: industrial-etl
        from:
          uri: "sql:SELECT * FROM raw_telemetry WHERE processed = false"
          parameters:
            dataSource: "#industrialDb"
            delay: 15000
          steps:
            - log:
                message: "ETL processing ${body.size()} raw telemetry records"
            - split:
                simple: "${body}"
                steps:
                  - setBody:
                      simple: "INSERT INTO processed_telemetry (device_id, metric, value, ts) VALUES ('${body[device_id]}', '${body[metric]}', ${body[value]}, '${body[timestamp]}')"
                  - to:
                      uri: "jdbc:analyticsDb"
            - to:
                uri: "sql:UPDATE raw_telemetry SET processed = true WHERE processed = false"
                parameters:
                  dataSource: "#industrialDb"
---
