apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: api-gateway
  labels:
    platform.io/catalog-category: integration-patterns
    platform.io/camel-component: platform-http
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/api-gateway
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: api-gateway
        from:
          uri: "platform-http:/api/v1/{resource}"
          steps:
            - log:
                message: "API Gateway routing: ${headers.resource}"
            - choice:
                when:
                  - simple: "${headers.resource} == 'users'"
                    steps:
                      - to:
                          uri: "http://user-service:8080/api/users"
                  - simple: "${headers.resource} == 'orders'"
                    steps:
                      - to:
                          uri: "http://order-service:8080/api/orders"
                  - simple: "${headers.resource} == 'products'"
                    steps:
                      - to:
                          uri: "http://product-service:8080/api/products"
                otherwise:
                  steps:
                    - setHeader:
                        name: CamelHttpResponseCode
                        constant: 404
                    - setBody:
                        constant: '{"error":"Resource not found"}'
