apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: mllp-hl7-message
  labels:
    platform.io/catalog-category: iot-industrial
    platform.io/camel-component: mllp
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/mllp-hl7-message
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: mllp-hl7-message
        from:
          uri: "mllp:0.0.0.0:8888"
          parameters:
            autoAck: true
          steps:
            - log:
                message: "Received HL7 message: ${headers.CamelMllpMessageType}"
            - choice:
                when:
                  - simple: "${headers.CamelMllpMessageType} == 'ADT'"
                    steps:
                      - to:
                          uri: "jms:queue:hl7-adt-messages"
                otherwise:
                  steps:
                    - to:
                        uri: "jms:queue:hl7-other-messages"
