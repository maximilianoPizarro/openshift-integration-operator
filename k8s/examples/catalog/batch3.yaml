apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: quickfix-trade
  labels:
    platform.io/catalog-category: finance-compliance
    platform.io/camel-component: quickfix
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/quickfix-trade
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: quickfix-trade
        from:
          uri: "quickfix:examples/inprocess.cfg?sessionID=FIX.4.4:BANZAI->EXEC"
          steps:
            - log:
                message: "Received FIX trade message: ${headers.EventCategory}"
            - choice:
                when:
                  - simple: "${headers.EventCategory} == 'AppMessageReceived'"
                    steps:
                      - to:
                          uri: "kafka:fix-trades"
                          parameters:
                            brokers: kafka-broker:9092
                otherwise:
                  steps:
                    - log:
                        message: "FIX session event: ${headers.EventCategory}"
---
