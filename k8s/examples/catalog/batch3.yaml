apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: google-mail-filter
  labels:
    platform.io/catalog-category: enterprise-saas
    platform.io/camel-component: google-mail
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/google-mail-filter
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: google-mail-filter
        from:
          uri: "google-mail-stream://messages"
          parameters:
            clientId: "{{google.clientId}}"
            clientSecret: "{{google.clientSecret}}"
            refreshToken: "{{google.refreshToken}}"
            query: "is:unread label:inbox"
            delay: 30000
          steps:
            - log:
                message: "New Gmail: from=${body.from}, subject=${body.subject}"
            - choice:
                when:
                  - simple: "${body.subject} contains 'urgent'"
                    steps:
                      - to:
                          uri: "kafka:urgent-emails"
                otherwise:
                  steps:
                    - to:
                        uri: "kafka:normal-emails"
