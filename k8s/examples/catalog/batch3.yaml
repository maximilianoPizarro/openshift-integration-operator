apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: modbus-plc-read
  labels:
    platform.io/catalog-category: iot-industrial
    platform.io/camel-component: modbus
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/modbus-plc-read
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: modbus-plc-read
        from:
          uri: "timer:modbus-poll"
          parameters:
            period: 5000
          steps:
            - setHeader:
                name: CamelModbusUnitId
                constant: 1
            - to:
