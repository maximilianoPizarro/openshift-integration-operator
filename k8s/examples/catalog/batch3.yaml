apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: fraud-detection
  labels:
    platform.io/catalog-category: finance-compliance
    platform.io/camel-component: kafka
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/fraud-detection
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: fraud-detection
        from:
          uri: "kafka:payment-events"
          parameters:
            brokers: kafka-broker:9092
            groupId: fraud-detector
          steps:
            - unmarshal:
                json:
                  library: Jackson
            - log:
                message: "Fraud check for payment: ${body[paymentId]}, amount: ${body[amount]}"
            - to:
                uri: "bean:fraudScoringEngine?method=score"
            - choice:
                when:
                  - simple: "${body[fraudScore]} > 80"
                    steps:
                      - log:
                          message: "HIGH FRAUD RISK: score=${body[fraudScore]}"
                      - to:
                          uri: "kafka:fraud-alerts"
                otherwise:
                  steps:
                    - to:
                        uri: "kafka:cleared-payments"
