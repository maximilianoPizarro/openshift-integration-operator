apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: box-workflow
  labels:
    platform.io/catalog-category: enterprise-saas
    platform.io/camel-component: box
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/box-workflow
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: box-workflow
        from:
          uri: "box://events/listen"
          parameters:
            clientId: "{{box.clientId}}"
            clientSecret: "{{box.clientSecret}}"
            userName: "{{box.user}}"
            userPassword: "{{box.pass}}"
          steps:
            - log:
                message: "Box event: ${body.eventType} on ${body.source.name}"
            - choice:
                when:
                  - simple: "${body.eventType} == 'ITEM_UPLOAD'"
                    steps:
                      - to:
                          uri: "kafka:box-uploads"
                  - simple: "${body.eventType} == 'ITEM_DOWNLOAD'"
                    steps:
                      - to:
                          uri: "kafka:box-downloads"
