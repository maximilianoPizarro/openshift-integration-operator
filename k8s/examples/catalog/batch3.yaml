apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: service-mesh-proxy
  labels:
    platform.io/catalog-category: integration-patterns
    platform.io/camel-component: platform-http
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/service-mesh-proxy
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: service-mesh-proxy
        from:
          uri: "platform-http:/proxy/{service}/{path}"
          steps:
            - log:
                message: "Proxying to ${headers.service}/${headers.path}"
            - circuitBreaker:
                resilience4jConfiguration:
                  failureRateThreshold: 50
                  waitDurationInOpenState: 30
                steps:
                  - toD:
                      uri: "http://${headers.service}:8080/${headers.path}"
                onFallback:
                  steps:
                    - setHeader:
                        name: CamelHttpResponseCode
                        constant: 503
                    - setBody:
                        constant: '{"error":"Service temporarily unavailable"}'
