  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: snmp-poll
        from:
          uri: "snmp:192.168.1.1:161"
          parameters:
            protocol: udp
            type: POLL
            oids: "1.3.6.1.2.1.1.3.0,1.3.6.1.2.1.1.5.0"
