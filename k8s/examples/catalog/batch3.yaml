apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: outbox-pattern
  labels:
    platform.io/catalog-category: integration-patterns
    platform.io/camel-component: sql
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/outbox-pattern
  branch: main
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: outbox-pattern
        from:
          uri: "sql:SELECT id, aggregate_type, aggregate_id, event_type, payload FROM outbox WHERE published = false ORDER BY created_at LIMIT 100"
          parameters:
            dataSource: "#appDb"
            delay: 1000
          steps:
            - split:
                simple: "${body}"
                steps:
                  - log:
                      message: "Publishing outbox event: ${body[event_type]} for ${body[aggregate_type]}"
                  - setHeader:
                      name: kafka.KEY
                      simple: "${body[aggregate_id]}"
                  - setBody:
                      simple: "${body[payload]}"
                  - to:
                      uri: "kafka:domain-events"
                      parameters:
                        brokers: kafka-broker:9092
                  - to:
                      uri: "sql:UPDATE outbox SET published = true WHERE id = :#${body[id]}"
