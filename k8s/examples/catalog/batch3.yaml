apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: snmp-poll
  labels:
    platform.io/catalog-category: iot-industrial
    platform.io/camel-component: snmp
spec:
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  gitRepository: https://gitea.example.com/user1/snmp-poll
