# Ephemeral Shopify order sync demo
# oc create secret generic shopify-credentials -n openshift-integration \
#   --from-literal=SHOPIFY_ACCESS_TOKEN=REPLACE --from-literal=SHOPIFY_SHOP_DOMAIN=myshop.myshopify.com
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: ephemeral-shopify-orders
  namespace: openshift-integration
spec:
  deploymentMode: EPHEMERAL
  integrationType: CAMEL_ROUTE
  engine: CAMEL
  ephemeral:
    ttlSeconds: 3600
    workerImage: quay.io/maximilianopizarro/camel-worker-http:v0.8.0
  secrets:
    - name: shopify-credentials
      envFrom: true
  targeting:
    strategy: explicit
    clusters: [local]
  kaotoDesign: |
    - route:
        id: shopify-order-sync
        from:
          uri: "timer:shopifyTick?period=300000"
          steps:
            - setHeader:
                name: CamelHttpMethod
                constant: GET
            - to:
                uri: "https:shopify-admin/orders.json"
            - log:
                message: "Shopify orders synced: ${body}"
