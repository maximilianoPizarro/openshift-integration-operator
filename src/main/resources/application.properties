# Quarkus Operator SDK configuration
quarkus.operator-sdk.crd.generate-all=true
quarkus.operator-sdk.crd.apply=true

# HTTP — port 8080 for probes; HTTPS on 8443 enabled via Helm env (QUARKUS_HTTP_SSL_*)
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/

# Health checks
quarkus.smallrye-health.root-path=/q/health

# OpenAPI
quarkus.smallrye-openapi.info-title=OpenShift Integration Operator API
quarkus.smallrye-openapi.info-version=0.8.1
quarkus.smallrye-openapi.info-description=Real-Time Integration & Orchestration Platform for OpenShift

# OpenTelemetry (graceful degradation if collector is unavailable)
quarkus.otel.exporter.otlp.endpoint=http://integration-otel-collector:4317
quarkus.otel.service.name=openshift-integration-operator
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.sdk.disabled=false

# Git provider defaults (overridden by env vars GIT_*, GITEA_*, GITHUB_*, GITLAB_*)
git.provider=auto
git.url=${GITEA_URL:https://gitea.example.com}
git.username=${GITEA_USERNAME:user1}
git.password=${GITEA_PASSWORD:password}
gitea.url=${GITEA_URL:https://gitea.example.com}
gitea.username=${GITEA_USERNAME:user1}
gitea.password=${GITEA_PASSWORD:password}
gitea.org=${GITEA_ORG:user1}
github.url=https://api.github.com
gitlab.url=https://gitlab.com

# MCP Security - empty allows all; set prefix URLs to restrict (SSRF mitigation)
mcp.allowed-server-urls=

# Per-flow worker HPA defaults (reconciler creates one HPA per IntegrationFlow)
workers.enabled=true
workers.min-replicas=1
workers.max-replicas=10
workers.target-cpu-utilization=70
workers.target-memory-utilization=80

# Ephemeral try-it mode
ephemeral.enabled=true
ephemeral.default-ttl-seconds=3600
ephemeral.max-ttl-seconds=86400
scaffolds.source=embedded

ephemeral.prefer-full-worker=false
ephemeral.camel-worker-image=quay.io/maximilianopizarro/camel-worker-core:v0.8.0
ephemeral.camel-worker-messaging-image=quay.io/maximilianopizarro/camel-worker-messaging:v0.8.0
ephemeral.camel-worker-http-image=quay.io/maximilianopizarro/camel-worker-http:v0.8.0
ephemeral.camel-worker-data-image=quay.io/maximilianopizarro/camel-worker-data:v0.8.0
ephemeral.camel-worker-cloud-image=quay.io/maximilianopizarro/camel-worker-cloud:v0.8.0
ephemeral.camel-worker-ai-image=quay.io/maximilianopizarro/camel-worker-ai:v0.8.0
ephemeral.camel-worker-full-image=quay.io/maximilianopizarro/camel-worker-full:v0.8.0
ephemeral.camel-test-image=quay.io/maximilianopizarro/camel-test-runner:v0.8.0

# Platform / SonataFlow / Kaoto (overridden by Helm env vars)
platform.namespace=${PLATFORM_NAMESPACE:openshift-integration}
platform.flow-catalog.source=${FLOW_CATALOG_SOURCE:remote}
platform.flow-catalog.config-map-name=${FLOW_CATALOG_CONFIG_MAP_NAME:flow-catalog}
platform.flow-catalog.config-map-key=${FLOW_CATALOG_CONFIG_MAP_KEY:flow-catalog.json}
console-plugin.version=0.8.1
console-plugin.operator-service-port=8443
console-plugin.backend-port=9443
sonataflow.enabled=true
sonataflow.namespace=kogito-bpm
sonataflow.cr-name-prefix=iflow-
sonataflow.api-version=sonataflow.org/v1alpha08
sonataflow.console-url=
sonataflow.console-route-host=
kaoto.enabled=true
kaoto.image=quay.io/kaotoio/kaoto-app:main
kaoto.replicas=1
kaoto.instance-url=
kaoto.route-host=
tekton.enabled=true
otel.collector.enabled=true
otel.collector.image=ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.109.0
otel.collector.replicas=1
platform.sidecar-reconcile-interval=120s
platform.sidecar-reconcile-delay=120s
argocd.namespace=openshift-gitops

# Container Image (Jib)
quarkus.container-image.group=maximilianopizarro
quarkus.container-image.name=openshift-integration-operator
quarkus.container-image.tag=latest
quarkus.container-image.registry=quay.io

# Kubernetes / OpenShift deployment hints
quarkus.kubernetes.deployment-target=openshift
quarkus.openshift.expose=true
quarkus.openshift.labels."app.kubernetes.io/part-of"=integration-platform
