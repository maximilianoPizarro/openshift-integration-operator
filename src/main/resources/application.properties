# Quarkus Operator SDK configuration
quarkus.operator-sdk.crd.generate-all=true
quarkus.operator-sdk.crd.apply=true

# HTTP
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/

# Health checks
quarkus.smallrye-health.root-path=/q/health

# OpenAPI
quarkus.smallrye-openapi.info-title=OpenShift Integration Operator API
quarkus.smallrye-openapi.info-version=0.2.0
quarkus.smallrye-openapi.info-description=Real-Time Integration & Orchestration Platform for OpenShift

# OpenTelemetry (graceful degradation if collector is unavailable)
quarkus.otel.exporter.otlp.endpoint=http://otel-collector:4317
quarkus.otel.service.name=openshift-integration-operator
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.sdk.disabled=false

# Git provider defaults (overridden by env vars GIT_*, GITEA_*, GITHUB_*, GITLAB_*)
git.provider=auto
gitea.url=https://gitea-gitea.apps.cluster.local
gitea.username=user1
gitea.password=password
gitea.org=user1
github.url=https://api.github.com
gitlab.url=https://gitlab.com

# Container Image (Jib)
quarkus.container-image.group=maximilianopizarro
quarkus.container-image.name=openshift-integration-operator
quarkus.container-image.tag=latest
quarkus.container-image.registry=quay.io

# Kubernetes / OpenShift deployment hints
quarkus.kubernetes.deployment-target=openshift
quarkus.openshift.expose=true
quarkus.openshift.labels."app.kubernetes.io/part-of"=integration-platform
