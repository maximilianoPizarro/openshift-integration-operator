camel.main.routes-reload-enabled=true
camel.main.routes-include-pattern=file:/deployments/config/flow.camel.yaml

# Infinispan: lazy placeholder so the extension does not crash at startup
# (pulled transitively; real hosts injected via env when routes actually need it)
quarkus.infinispan-client.hosts=${INFINISPAN_HOSTS:localhost:11222}
quarkus.infinispan-client.devservices.enabled=false
quarkus.infinispan-client.health.enabled=false
quarkus.infinispan-client.use-auth=false
