name: Build and push to Quay.io

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (e.g. v0.2.0)'
        required: false
        default: ''
        type: string

env:
  QUAY_REGISTRY: quay.io
  QUAY_NAMESPACE: maximilianopizarro
  IMAGE_NAME: openshift-integration-operator
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test

  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate examples catalog components
        run: python3 scripts/validate-catalog.py

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Helm lint and template
        run: |
          helm lint helm/openshift-integration-operator
          helm template integration-operator helm/openshift-integration-operator > /tmp/rendered.yaml

  build-jvm:
    runs-on: ubuntu-latest
    needs: [test, validate-catalog, helm-lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image tags
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          echo "IMAGE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "IMAGE_SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            VERSION_TAG="${{ github.event.inputs.image_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG=""
          fi
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to registry.access.redhat.com
        uses: docker/login-action@v3
        with:
          registry: registry.access.redhat.com
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}

      - name: Login to registry.redhat.io
        uses: docker/login-action@v3
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare JVM image tags
        id: jvm-tags
        run: |
          IMAGE="${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}"
          TAGS="${IMAGE}:latest,${IMAGE}:${{ env.IMAGE_SHA }},${IMAGE}:${{ env.IMAGE_SHORT_SHA }}"
          if [ -n "${{ env.VERSION_TAG }}" ]; then
            TAGS="${TAGS},${IMAGE}:${{ env.VERSION_TAG }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push JVM operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/main/docker/Dockerfile.jvm
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.jvm-tags.outputs.tags }}

  build-console-plugin:
    runs-on: ubuntu-latest
    needs: [test, validate-catalog, helm-lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image tags
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          echo "IMAGE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "IMAGE_SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            VERSION_TAG="${{ github.event.inputs.image_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG=""
          fi
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to registry.access.redhat.com
        uses: docker/login-action@v3
        with:
          registry: registry.access.redhat.com
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare console plugin tags
        id: plugin-tags
        run: |
          IMAGE="${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/integration-console-plugin"
          TAGS="${IMAGE}:latest,${IMAGE}:${{ env.IMAGE_SHA }},${IMAGE}:${{ env.IMAGE_SHORT_SHA }}"
          if [ -n "${{ env.VERSION_TAG }}" ]; then
            TAGS="${TAGS},${IMAGE}:${{ env.VERSION_TAG }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push console plugin image
        uses: docker/build-push-action@v6
        with:
          context: ./console-plugin
          file: ./console-plugin/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.plugin-tags.outputs.tags }}

  build-camel-workers:
    runs-on: ubuntu-latest
    needs: [test, validate-catalog]
    continue-on-error: true
    strategy:
      matrix:
        worker:
          - camel-worker-core
          - camel-worker-messaging
          - camel-worker-http
          - camel-worker-data
          - camel-worker-cloud
          - camel-worker-ai
          - camel-worker-full
          - camel-yaml-worker
          - camel-test-runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to registry.access.redhat.com
        uses: docker/login-action@v3
        with:
          registry: registry.access.redhat.com
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.worker }} image
        uses: docker/build-push-action@v6
        with:
          context: ./workers/${{ matrix.worker }}
          file: ./workers/${{ matrix.worker }}/Dockerfile.jvm
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.worker }}:v0.3.0
            ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.worker }}:latest

  build-native:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve native image tags
        run: |
          VERSION_TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "NATIVE_VERSION_TAG=${VERSION_TAG}-native" >> "$GITHUB_ENV"

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push native operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/main/docker/Dockerfile.native
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:native-latest
            ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.NATIVE_VERSION_TAG }}

  build-bundle:
    runs-on: ubuntu-latest
    needs: [build-jvm, build-console-plugin]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (generates CRD + bundle)
        run: mvn -B package -DskipTests

      - name: Install operator-sdk
        run: |
          export ARCH=$(case $(uname -m) in x86_64) echo -n amd64 ;; aarch64) echo -n arm64 ;; *) echo -n $(uname -m) ;; esac)
          export OS=$(uname | awk '{print tolower($0)}')
          export OPERATOR_SDK_DL_URL=https://github.com/operator-framework/operator-sdk/releases/download/v1.40.0
          curl -sLO ${OPERATOR_SDK_DL_URL}/operator-sdk_${OS}_${ARCH}
          chmod +x operator-sdk_${OS}_${ARCH}
          sudo mv operator-sdk_${OS}_${ARCH} /usr/local/bin/operator-sdk

      - name: Validate OLM bundle
        run: operator-sdk bundle validate ./bundle

      - name: Resolve bundle tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "BUNDLE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "BUNDLE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "BUNDLE_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push OLM bundle image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./bundle.Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}-bundle:${{ env.BUNDLE_TAG }}
            ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}-bundle:latest

  helm-publish:
    runs-on: ubuntu-latest
    needs: [build-jvm, build-console-plugin]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Package Helm chart
        run: helm package helm/openshift-integration-operator --destination docs/

      - name: Update Helm repo index
        run: helm repo index docs/ --url https://maximilianopizarro.github.io/openshift-integration-operator/

      - name: Commit and push Helm chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: update Helm chart package [skip ci]"
          git push
