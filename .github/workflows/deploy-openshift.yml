name: Deploy to OpenShift

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
        type: string

env:
  QUAY_REGISTRY: quay.io
  QUAY_NAMESPACE: maximilianopizarro
  IMAGE_NAME: openshift-integration-operator
  NAMESPACE: openshift-integration
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG=v0.1.0; fi
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"

      - name: Login to OpenShift
        run: |
          oc login --token=${{ secrets.OC_TOKEN }} --server=${{ secrets.OC_SERVER }} --insecure-skip-tls-verify=true

      - name: Create namespace if not exists
        run: |
          oc new-project ${{ env.NAMESPACE }} 2>/dev/null || oc project ${{ env.NAMESPACE }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Apply CRD
        run: |
          oc apply -f target/kubernetes/integrationflows.platform.io-v1.yml 2>/dev/null || echo "CRD will be applied by operator"

      - name: Deploy operator via Helm
        run: |
          helm upgrade --install openshift-integration-operator \
            helm/openshift-integration-operator \
            --namespace ${{ env.NAMESPACE }} \
            --set operator.image.repository=${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }} \
            --set operator.image.tag=${{ env.IMAGE_TAG }} \
            --set operator.image.pullPolicy=Always \
            --wait --timeout 5m

      - name: Verify deployment
        run: |
          oc rollout status deployment/openshift-integration-operator -n ${{ env.NAMESPACE }} --timeout=300s
          echo "--- Operator pods ---"
          oc get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=openshift-integration-operator
          echo "--- CRD status ---"
          oc get crd integrationflows.platform.io || echo "CRD pending"
