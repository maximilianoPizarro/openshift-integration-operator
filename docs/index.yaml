apiVersion: v1
entries:
  openshift-integration-operator:
  - annotations:
      artifacthub.io/changes: |
        - kind: changed
          description: Helm chart and Artifact Hub logo updated to match GitHub Pages branding (OpenShift + Helm + Camel)
        - kind: added
          description: Full worker image list in artifacthub.io/images for Trivy scans (core, messaging, http, data, cloud, ai, full, yaml, test-runner)
        - kind: added
          description: GitHub Pages security dashboard with per-image vulnerability breakdown from Artifact Hub
        - kind: changed
          description: Console plugin uses manual Refresh instead of aggressive auto-polling on list and overview pages
        - kind: added
          description: OperatorHub and Artifact Hub links with security report on docs and README
        - kind: added
          description: Domain-specific ephemeral worker images (core, messaging, http, data, cloud, ai, full) with auto-selection
        - kind: added
          description: External Secrets Operator template and secrets provider configuration
        - kind: added
          description: Catalog validation CI job and Java 17/21 build matrix
        - kind: changed
          description: Console plugin served by Go static server (golang runtime label)
        - kind: added
          description: Five integration types — Camel Route, Kamelet, Pipe, Test, SonataFlow
        - kind: added
          description: Multi-provider Git support — Gitea, GitHub, GitLab with auto-detection
        - kind: added
          description: Visual flow diagram with branching logic (choice, multicast, doTry) and click-to-YAML
        - kind: added
          description: Embedded SonataFlow Management Console for workflow monitoring
        - kind: added
          description: Console plugin search, filters, pagination, and resource links (Pods, Pipelines, ArgoCD)
        - kind: added
          description: Tekton Pipeline template (git-clone, maven, buildah) with workspace bindings
        - kind: added
          description: OpenTelemetry Collector deployment and operator integration
        - kind: added
          description: Camel BOM dependency management in scaffolded worker pom.xml
        - kind: added
          description: 9 production-ready example IntegrationFlows including ephemeral Quick Try
        - kind: added
          description: Ephemeral Quick Try mode — deploy without Git, TTL extend, promote to GitOps
        - kind: added
          description: Console plugin served from Deployment on port 9443 with backend proxy integration-console-plugin
        - kind: added
          description: Flow Logs tab — live worker pod logs via operator REST API
        - kind: fixed
          description: Operator HTTPS on port 8443 with serving cert for console plugin backend proxy (fixes 502 on logs/telemetry/lifecycle)
        - kind: added
          description: GitUrlResolver rewrites placeholder git hosts to configured provider URLs
        - kind: added
          description: MCP Bridge for AI tool discovery and invocation
        - kind: added
          description: HPA v2 worker autoscaling with configurable thresholds
        - kind: added
          description: SonataFlow CR auto-deployment to OpenShift Serverless Logic operator (kogito-bpm)
        - kind: added
          description: Git sync on flow modification — Save pushes design changes to Git immediately
        - kind: added
          description: Platform Status dashboard — real-time health checks for Operator, Kaoto, Gitea, ArgoCD, Tekton, OTel
        - kind: added
          description: Flow Overview dashboard — KPI cards, flow distribution by type/phase, recent builds
        - kind: added
          description: Pause/Resume/Stop lifecycle controls, circuit breaker toggle, scheduled execution
        - kind: added
          description: Declarative retry policy and circuit breaker configuration in IntegrationFlow spec
        - kind: added
          description: PrometheusRule auto-generation for per-flow alerting
        - kind: added
          description: RBAC for SonataFlow CRs, PrometheusRules, CronJobs, and ApplicationSets
        - kind: added
          description: values.schema.json for Helm chart validation and IDE autocompletion
      artifacthub.io/containsSecurityUpdates: "false"
      artifacthub.io/crds: |
        - kind: IntegrationFlow
          version: v1alpha1
          name: integrationflows.platform.io
          displayName: Integration Flow
          description: Defines an integration workflow using Apache Camel or SonataFlow engine with Kaoto visual design
      artifacthub.io/crdsExamples: |
        - apiVersion: platform.io/v1alpha1
          kind: IntegrationFlow
          metadata:
            name: sample-camel-flow
          spec:
            engine: CAMEL
            gitRepository: https://gitea.example.com/demo/sample-camel-worker.git
            branch: main
            targeting:
              strategy: explicit
              clusters:
                - local
            kaotoDesign: |
              - route:
                  from:
                    uri: timer:tick
                    parameters:
                      period: 5000
                    steps:
                      - log:
                          message: "Hello from IntegrationFlow"
      artifacthub.io/images: |
        - name: operator
          image: quay.io/maximilianopizarro/openshift-integration-operator:v0.8.0
        - name: console-plugin
          image: quay.io/maximilianopizarro/integration-console-plugin:v0.8.0
        - name: camel-worker-core
          image: quay.io/maximilianopizarro/camel-worker-core:v0.8.0
        - name: camel-worker-messaging
          image: quay.io/maximilianopizarro/camel-worker-messaging:v0.8.0
        - name: camel-worker-http
          image: quay.io/maximilianopizarro/camel-worker-http:v0.8.0
        - name: camel-worker-data
          image: quay.io/maximilianopizarro/camel-worker-data:v0.8.0
        - name: camel-worker-cloud
          image: quay.io/maximilianopizarro/camel-worker-cloud:v0.8.0
        - name: camel-worker-ai
          image: quay.io/maximilianopizarro/camel-worker-ai:v0.8.0
        - name: camel-worker-full
          image: quay.io/maximilianopizarro/camel-worker-full:v0.8.0
        - name: camel-yaml-worker
          image: quay.io/maximilianopizarro/camel-yaml-worker:v0.8.0
        - name: camel-test-runner
          image: quay.io/maximilianopizarro/camel-test-runner:v0.8.0
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Documentation
          url: https://maximilianopizarro.github.io/openshift-integration-operator/
        - name: Architecture
          url: https://maximilianopizarro.github.io/openshift-integration-operator/architecture.html
        - name: Quick Start
          url: https://maximilianopizarro.github.io/openshift-integration-operator/quickstart.html
        - name: OperatorHub
          url: https://operatorhub.io/operator/openshift-integration-operator
        - name: Security report
          url: https://artifacthub.io/packages/helm/openshift-integration-operator/openshift-integration-operator?tab=security-report
        - name: Vulnerability dashboard
          url: https://maximilianopizarro.github.io/openshift-integration-operator/security.html
        - name: Source Code
          url: https://github.com/maximilianoPizarro/openshift-integration-operator
      artifacthub.io/operator: "true"
      artifacthub.io/operatorCapabilities: Basic Install
      artifacthub.io/prerelease: "true"
      artifacthub.io/recommendations: |
        - url: https://artifacthub.io/packages/helm/openshift-gitops/openshift-gitops
        - url: https://artifacthub.io/packages/helm/tektoncd/tekton-pipelines
