<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#388bfd"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#8957e5"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#51cf66"/></marker>
  </defs>

  <rect width="900" height="280" rx="12" fill="#0d1117"/>
  <text x="450" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">MCP Bridge  AI Tool Integration</text>
  <text x="450" y="48" text-anchor="middle" fill="#8b949e" font-size="11"></text>

  <!-- Console / User -->
  <rect x="30" y="90" width="150" height="100" rx="10" fill="#1c2128" stroke="#388bfd" stroke-width="1.5"/>
  <text x="105" y="118" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="600">Console Plugin</text>
  <text x="105" y="140" text-anchor="middle" fill="#8b949e" font-size="10">MCP Tools Panel</text>
  <rect x="45" y="150" width="120" height="24" rx="4" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)" stroke-width="1"/>
  <text x="105" y="167" text-anchor="middle" fill="#58a6ff" font-size="9">Discover + Invoke</text>

  <!-- Arrow Console > Operator -->
  <path d="M180,140 L250,140" stroke="#388bfd" stroke-width="2" marker-end="url(#ab)"/>
  <text x="215" y="132" text-anchor="middle" fill="#8b949e" font-size="9">REST</text>

  <!-- Operator MCP Bridge -->
  <rect x="255" y="70" width="200" height="140" rx="10" fill="#1c2128" stroke="#8957e5" stroke-width="1.5"/>
  <text x="355" y="95" text-anchor="middle" fill="#d0bfff" font-size="13" font-weight="600">MCP Bridge Service</text>
  <rect x="270" y="105" width="170" height="28" rx="5" fill="rgba(137,87,229,0.1)" stroke="rgba(137,87,229,0.25)" stroke-width="1"/>
  <text x="355" y="124" text-anchor="middle" fill="#d0bfff" font-size="10">GET /api/mcp/tools</text>
  <rect x="270" y="140" width="170" height="28" rx="5" fill="rgba(137,87,229,0.1)" stroke="rgba(137,87,229,0.25)" stroke-width="1"/>
  <text x="355" y="159" text-anchor="middle" fill="#d0bfff" font-size="10">POST /api/mcp/tools/{name}/call</text>
  <text x="355" y="190" text-anchor="middle" fill="#8b949e" font-size="9">JSON-RPC 2.0 Client</text>
  <text x="355" y="203" text-anchor="middle" fill="#8b949e" font-size="9">tools/list - tools/call</text>

  <!-- Arrow Bridge > MCP Servers -->
  <path d="M455,110 L540,80" stroke="#8957e5" stroke-width="2" marker-end="url(#ap)"/>
  <path d="M455,140 L540,140" stroke="#8957e5" stroke-width="2" marker-end="url(#ap)"/>
  <path d="M455,170 L540,200" stroke="#8957e5" stroke-width="2" marker-end="url(#ap)"/>

  <!-- MCP Server 1 -->
  <rect x="545" y="60" width="155" height="50" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="622" y="82" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="500">Web Search MCP</text>
  <text x="622" y="98" text-anchor="middle" fill="#8b949e" font-size="9">web_search, scrape</text>

  <!-- MCP Server 2 -->
  <rect x="545" y="120" width="155" height="50" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="622" y="142" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="500">Database MCP</text>
  <text x="622" y="158" text-anchor="middle" fill="#8b949e" font-size="9">query, insert, update</text>

  <!-- MCP Server 3 -->
  <rect x="545" y="180" width="155" height="50" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="622" y="202" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="500">Custom MCP</text>
  <text x="622" y="218" text-anchor="middle" fill="#8b949e" font-size="9">any tool definition</text>

  <!-- Arrow MCP > AI -->
  <path d="M700,85 L760,85" stroke="#51cf66" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M700,145 L760,145" stroke="#51cf66" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M700,205 L760,205" stroke="#51cf66" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- External AI/Services -->
  <rect x="765" y="60" width="115" height="50" rx="8" fill="rgba(47,158,68,0.1)" stroke="rgba(47,158,68,0.3)" stroke-width="1.5"/>
  <text x="822" y="82" text-anchor="middle" fill="#69db7c" font-size="11" font-weight="500">AI Models</text>
  <text x="822" y="98" text-anchor="middle" fill="#8b949e" font-size="9">GPT, Claude, etc.</text>

  <rect x="765" y="120" width="115" height="50" rx="8" fill="rgba(47,158,68,0.1)" stroke="rgba(47,158,68,0.3)" stroke-width="1.5"/>
  <text x="822" y="142" text-anchor="middle" fill="#69db7c" font-size="11" font-weight="500">Databases</text>
  <text x="822" y="158" text-anchor="middle" fill="#8b949e" font-size="9">PostgreSQL, Redis</text>

  <rect x="765" y="180" width="115" height="50" rx="8" fill="rgba(47,158,68,0.1)" stroke="rgba(47,158,68,0.3)" stroke-width="1.5"/>
  <text x="822" y="202" text-anchor="middle" fill="#69db7c" font-size="11" font-weight="500">APIs</text>
  <text x="822" y="218" text-anchor="middle" fill="#8b949e" font-size="9">REST, GraphQL</text>

  <text x="450" y="262" text-anchor="middle" fill="#8b949e" font-size="10">MCP Bridge connects integration flows to external AI tools and services via the Model Context Protocol standard</text>
</svg>
